<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#111; color:#eee; font-family:system-ui, sans-serif; }
  canvas { background:#1b1b1b; border:2px solid #444; max-width:95vw; touch-action:none; }
  #info { margin:12px; font-size:18px; }
  small { color:#888; margin-top:8px; text-align:center; padding:0 16px; }
</style>
</head>
<body>
<div id="info">Punkte: <span id="score">0</span> · Highscore: <span id="best">0</span></div>
<canvas id="c" width="400" height="400"></canvas>
<small>Pfeiltasten / WASD steuern · Leertaste = Pause/Neustart · Wischen auf dem Handy</small>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const N = 20, S = cv.width / N;
let snake, dir, nextDir, food, score, running, over;
let best = 0;
try { best = +(localStorage.getItem('snakeBest') || 0); } catch (e) {}
document.getElementById('best').textContent = best;

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = nextDir = {x:1,y:0};
  score = 0; over = false; running = true;
  document.getElementById('score').textContent = 0;
  placeFood();
}
function placeFood() {
  do { food = {x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N)}; }
  while (snake.some(p => p.x===food.x && p.y===food.y));
}
function step() {
  if (!running || over) return;
  dir = nextDir;
  const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if (head.x<0||head.y<0||head.x>=N||head.y>=N||snake.some(p=>p.x===head.x&&p.y===head.y)) {
    over = true;
    if (score > best) {
      best = score;
      try { localStorage.setItem('snakeBest', best); } catch (e) {}
      document.getElementById('best').textContent = best;
    }
    return;
  }
  snake.unshift(head);
  if (head.x===food.x && head.y===food.y) {
    score++; document.getElementById('score').textContent = score; placeFood();
  } else snake.pop();
}
function draw() {
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath(); ctx.arc(food.x*S+S/2, food.y*S+S/2, S/2-2, 0, Math.PI*2); ctx.fill();
  snake.forEach((p,i) => { ctx.fillStyle = i ? '#2ecc71' : '#a3f7bf'; ctx.fillRect(p.x*S+1, p.y*S+1, S-2, S-2); });
  if (over || !running) {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 28px system-ui';
    ctx.fillText(over ? 'Game Over' : 'Pause', cv.width/2, cv.height/2);
    ctx.font = '16px system-ui';
    ctx.fillText('Leertaste / Tippen', cv.width/2, cv.height/2+30);
  }
}
function turn(x,y) { if (x !== -dir.x || y !== -dir.y) nextDir = {x,y}; }
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k==='arrowup'||k==='w') turn(0,-1);
  else if (k==='arrowdown'||k==='s') turn(0,1);
  else if (k==='arrowleft'||k==='a') turn(-1,0);
  else if (k==='arrowright'||k==='d') turn(1,0);
  else if (k===' ') { over ? reset() : running = !running; }
  else return;
  e.preventDefault();
});
let tx, ty;
cv.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; if (over) reset(); else if (!running) running = true; });
cv.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx),0); else if (dy) turn(0,Math.sign(dy));
});
reset();
setInterval(() => { step(); draw(); }, 110);
</script>
</body>
</html>
