<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a752c">
<meta name="description" content="Snake im Browser: Rasen-Spielfeld, runde Schlange und 9 Spielmodi.">
<title>Snake</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23aad751'/%3E%3Cpath d='M12 46C12 30 30 36 32 24S50 12 52 20' fill='none' stroke='%234e7cf6' stroke-width='10' stroke-linecap='round'/%3E%3Ccircle cx='52' cy='20' r='3' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --hud: #4a752c; --frame: #578a34; --ink: #203018; --muted: #6b7d5c;
    --card: #ffffff; --soft: #f1f7e8; --soft-2: #e3efd3; --accent: #4a752c;
    --blue: #3f6ff0; --blue-dark: #2b51c4;
    --font: 'Fredoka', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #3f6a24 radial-gradient(120% 90% at 50% 0%, #6fa344 0%, #3f6a24 55%, #294a15 100%) fixed;
    color: #fff; font-family: var(--font);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; min-height: 100dvh; overflow: hidden;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  }
  button { font-family: inherit; touch-action: manipulation; }
  .hidden { display: none !important; }

  #app { display: flex; flex-direction: column; padding: 8px 0; touch-action: none; }
  #hud {
    display: flex; align-items: center; gap: 14px; min-height: 54px;
    background: var(--hud); padding: 6px 10px 6px 14px; border-radius: 16px 16px 0 0;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .stat { display: flex; align-items: center; gap: 6px; font-size: 22px; font-weight: 600; line-height: 1; }
  .stat span { display: inline-block; min-width: 1ch; }
  .stat i[data-icon], .icon-btn i[data-icon] { display: flex; }
  .stat svg { width: 28px; height: 28px; flex: none; }
  .stat.bump span { animation: bump .3s ease-out; }
  .stat.warn { color: #ffd54f; animation: pulse 1s infinite; }
  .dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; box-shadow: 0 0 0 3px rgba(255,255,255,.25); vertical-align: middle; }
  .grow { flex: 1; }
  #mode-label { font-size: 15px; opacity: .85; white-space: nowrap; }
  .icon-btn {
    width: 40px; height: 40px; border: 0; border-radius: 12px; padding: 0; cursor: pointer;
    background: rgba(255,255,255,.12); color: #fff; display: grid; place-items: center;
  }
  .icon-btn:hover { background: rgba(255,255,255,.22); }
  .icon-btn svg { width: 22px; height: 22px; }

  #frame { position: relative; background: var(--frame); padding: 10px; border-radius: 0 0 16px 16px; box-shadow: 0 18px 40px rgba(0,0,0,.3); }
  #board { display: block; border-radius: 6px; }
  #hint {
    position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
    width: max-content; max-width: calc(100% - 40px); padding: 12px 18px; border-radius: 16px;
    background: rgba(22,40,10,.78); text-align: center; font-size: 15px; line-height: 1.55;
    pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.25); animation: float 2.4s ease-in-out infinite;
  }
  #hint .ht { font-weight: 600; font-size: 18px; }
  #hint .hd { opacity: .85; font-size: 14px; margin-bottom: 4px; }
  kbd {
    display: inline-block; min-width: 24px; padding: 1px 6px; margin: 0 1px; border-radius: 6px;
    background: #fff; color: #33402a; font: 600 13px/20px var(--font); box-shadow: 0 2px 0 #9fb08c;
  }

  #overlay {
    position: absolute; inset: 10px; display: flex; align-items: center; justify-content: center;
    padding: 12px; border-radius: 6px; background: rgba(20,36,10,.38);
  }
  .card {
    background: var(--card); color: var(--ink); border-radius: 22px; padding: 20px 24px 18px; text-align: center;
    min-width: min(260px, 100%); max-width: 100%; box-shadow: 0 24px 60px rgba(0,0,0,.35);
    animation: pop .28s cubic-bezier(.2,1.4,.4,1);
  }
  .card h2 { margin: 0 0 8px; font-size: 30px; font-weight: 700; }
  .card .sub { color: var(--muted); margin: -2px 0 10px; font-size: 15px; }
  .scores { display: flex; gap: 24px; justify-content: center; align-items: center; font-size: 32px; font-weight: 600; }
  .scores > div { display: flex; align-items: center; gap: 8px; }
  .scores svg { width: 34px; height: 34px; }
  .badge {
    display: inline-block; margin-top: 10px; padding: 4px 14px; border-radius: 99px;
    background: #ffca28; color: #5d4200; font-weight: 600; font-size: 15px; animation: wiggle 1.2s ease-in-out infinite;
  }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .btn { border: 0; border-radius: 14px; padding: 11px 20px; font-size: 17px; font-weight: 600; cursor: pointer; background: var(--soft-2); color: var(--ink); }
  .btn:hover { filter: brightness(.97); }
  .btn.primary { background: var(--blue); color: #fff; box-shadow: 0 4px 0 var(--blue-dark); }
  .btn.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--blue-dark); }
  .keys-hint { margin-top: 10px; font-size: 13px; color: var(--muted); }

  #dpad { display: none; }
  body.touch #dpad {
    display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 52px);
    gap: 6px; justify-content: center; margin-top: 12px;
  }
  #dpad button { border: 0; border-radius: 16px; background: rgba(255,255,255,.16); color: #fff; font-size: 22px; touch-action: none; }
  #dpad button:active { background: rgba(255,255,255,.34); }
  #dpad [data-dir=up] { grid-area: 1 / 2; }
  #dpad [data-dir=left] { grid-area: 2 / 1; }
  #dpad [data-dir=right] { grid-area: 2 / 3; }
  #dpad [data-dir=down] { grid-area: 3 / 2; }
  @media (orientation: landscape) { body.touch #dpad { display: none; } }

  #menu {
    position: fixed; inset: 0; z-index: 10; display: flex; padding: 16px; overflow-y: auto;
    background: rgba(16,30,8,.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); touch-action: pan-y;
  }
  .menu-card {
    position: relative; margin: auto; width: min(580px, 100%); padding: 20px 22px 18px; border-radius: 26px;
    background: var(--card); color: var(--ink); box-shadow: 0 30px 70px rgba(0,0,0,.4);
    animation: pop .3s cubic-bezier(.2,1.3,.4,1);
  }
  .logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; }
  .logo svg { width: 92px; height: 46px; }
  .logo h1 { margin: 0; font-size: 40px; font-weight: 700; letter-spacing: .5px; color: var(--hud); }
  .close { position: absolute; top: 12px; right: 12px; width: 38px; height: 38px; border: 0; border-radius: 50%; background: var(--soft); color: var(--ink); font-size: 18px; cursor: pointer; }
  .section { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 6px 0 8px; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .mode {
    display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px 8px;
    border: 2px solid transparent; border-radius: 16px; background: var(--soft); color: var(--ink); cursor: pointer;
    transition: transform .12s, background .12s;
  }
  .mode:hover { transform: translateY(-2px); background: var(--soft-2); }
  .mode.on { border-color: var(--accent); background: #d8eabf; }
  .mode .mi { font-size: 26px; line-height: 1.15; }
  .mode .mn { font-size: 14px; font-weight: 600; line-height: 1.2; }
  .mode .mb { font-size: 11.5px; color: var(--muted); }
  .mode-desc { text-align: center; color: var(--muted); margin: 10px 0 4px; min-height: 1.3em; font-size: 15px; }
  .row { display: grid; grid-template-columns: 88px 1fr; align-items: center; gap: 10px; margin-top: 10px; }
  .row .section { margin: 0; }
  .seg { display: flex; gap: 2px; padding: 3px; border-radius: 13px; background: var(--soft); }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 10px; font-size: 15px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { width: 34px; height: 34px; padding: 0; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #d3dec6; cursor: pointer; }
  .sw.on { box-shadow: 0 0 0 3px var(--accent); }
  .play {
    position: sticky; bottom: 4px; z-index: 1;
    display: block; width: 100%; margin-top: 18px; padding: 14px; border: 0; border-radius: 18px; cursor: pointer;
    font-size: 22px; font-weight: 700; color: #fff; background: linear-gradient(#5b8cff, var(--blue));
    box-shadow: 0 6px 0 var(--blue-dark), 0 12px 24px rgba(63,111,240,.35);
  }
  .play:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--blue-dark); }
  .help { text-align: center; color: var(--muted); font-size: 13px; margin: 14px 0 0; line-height: 1.6; }

  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes bump { 40% { transform: scale(1.35); } }
  @keyframes pulse { 50% { opacity: .55; } }
  @keyframes wiggle { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  @keyframes float { 50% { transform: translate(-50%, -4px); } }

  @media (max-width: 480px) {
    #mode-label { display: none; }
    #hud { gap: 10px; }
    .stat { font-size: 19px; }
    .stat svg { width: 24px; height: 24px; }
    .menu-card { padding: 16px 14px 14px; border-radius: 22px; }
    .logo h1 { font-size: 32px; }
    .logo svg { width: 70px; height: 36px; }
    .logo { margin-bottom: 8px; }
    .modes { gap: 6px; }
    .mode { padding: 7px 4px 6px; }
    .mode .mi { font-size: 22px; }
    .mode .mn { font-size: 12.5px; }
    .mode-desc { font-size: 14px; margin: 8px 0 2px; }
    .row { grid-template-columns: 70px 1fr; margin-top: 8px; }
    .seg button { font-size: 13.5px; padding: 7px 2px; }
    .swatches { gap: 8px; }
    .sw { width: 30px; height: 30px; }
    .play { margin-top: 14px; padding: 12px; font-size: 20px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main id="app">
  <header id="hud">
    <div class="stat" id="s-score" title="Äpfel"><i data-icon="apple"></i><span id="score">0</span></div>
    <div class="stat" id="s-best" title="Rekord"><i data-icon="trophy"></i><span id="best">0</span></div>
    <div class="stat hidden" id="s-p1"><i class="dot" id="p1dot"></i><span id="p1">0</span></div>
    <div class="stat hidden" id="s-p2"><i class="dot" id="p2dot"></i><span id="p2">0</span></div>
    <div class="stat hidden" id="s-time" title="Restzeit"><i data-icon="clock"></i><span id="time">60</span></div>
    <div class="grow"></div>
    <span id="mode-label"></span>
    <button class="icon-btn" id="btn-sound" type="button" title="Ton an/aus (M)" aria-label="Ton an/aus"></button>
    <button class="icon-btn" id="btn-pause" type="button" title="Pause (Leertaste)" aria-label="Pause"></button>
    <button class="icon-btn" id="btn-menu" type="button" title="Menü" aria-label="Menü"><i data-icon="menu"></i></button>
  </header>
  <div id="frame">
    <canvas id="board" aria-label="Spielfeld"></canvas>
    <div id="hint" class="hidden"></div>
    <div id="overlay" class="hidden"></div>
  </div>
  <div id="dpad">
    <button type="button" data-dir="up" aria-label="Hoch">▲</button>
    <button type="button" data-dir="left" aria-label="Links">◀</button>
    <button type="button" data-dir="right" aria-label="Rechts">▶</button>
    <button type="button" data-dir="down" aria-label="Runter">▼</button>
  </div>
</main>

<div id="menu" class="hidden" role="dialog" aria-label="Spielmenü">
  <div class="menu-card">
    <button class="close hidden" id="menu-close" type="button" aria-label="Menü schließen">✕</button>
    <div class="logo">
      <svg viewBox="0 0 120 60" aria-hidden="true">
        <path d="M10 42c14 0 14-22 30-22s16 22 32 22 14-18 26-20" fill="none" stroke="#4e7cf6" stroke-width="13" stroke-linecap="round"/>
        <circle cx="100" cy="22" r="9.5" fill="#4e7cf6"/>
        <circle cx="102" cy="17.5" r="3.6" fill="#fff"/><circle cx="103" cy="17.5" r="1.8" fill="#1b1b1b"/>
        <circle cx="102" cy="26.5" r="3.6" fill="#fff"/><circle cx="103" cy="26.5" r="1.8" fill="#1b1b1b"/>
      </svg>
      <h1>Snake</h1>
    </div>
    <div class="section">Spielmodus</div>
    <div class="modes" id="modes"></div>
    <p class="mode-desc" id="mode-desc"></p>
    <div class="row">
      <div class="section">Tempo</div>
      <div class="seg" data-setting="speed">
        <button type="button" data-v="slow">Langsam</button><button type="button" data-v="normal">Normal</button><button type="button" data-v="fast">Schnell</button>
      </div>
    </div>
    <div class="row">
      <div class="section">Spielfeld</div>
      <div class="seg" data-setting="size">
        <button type="button" data-v="s">Klein</button><button type="button" data-v="m">Mittel</button><button type="button" data-v="l">Groß</button>
      </div>
    </div>
    <div class="row">
      <div class="section">Äpfel</div>
      <div class="seg" data-setting="apples">
        <button type="button" data-v="1">1</button><button type="button" data-v="3">3</button><button type="button" data-v="5">5</button>
      </div>
    </div>
    <div class="row">
      <div class="section">Farbe</div>
      <div class="swatches" id="swatches"></div>
    </div>
    <button class="play" id="play" type="button">▶ Spielen</button>
    <p class="help" id="help"></p>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* ---------- Hilfsfunktionen ---------- */
  const $ = (s) => document.querySelector(s);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (n) => Math.floor(Math.random() * n);
  const easeOutBack = (t) => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isTouch = matchMedia('(hover: none) and (pointer: coarse)').matches;
  const store = {
    get(k, d) { try { const v = localStorage.getItem('snake.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('snake.' + k, JSON.stringify(v)); } catch (e) {} },
  };
  function mix(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const ch = (sh) => Math.round(((pa >> sh) & 255) + (((pb >> sh) & 255) - ((pa >> sh) & 255)) * t);
    return '#' + ((1 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0)).toString(16).slice(1);
  }
  function seeded(seed) {
    return () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------- Spielregeln & Einstellungen ---------- */
  const MODES = [
    { id: 'classic',  icon: '🍎', name: 'Klassisch',   desc: 'Das Original: Wand oder eigener Schwanz – dann ist Schluss.' },
    { id: 'wrap',     icon: '♾️', name: 'Ohne Wände',  desc: 'Fahr durch den Rand und komm auf der anderen Seite wieder raus.', wrap: true },
    { id: 'walls',    icon: '🧱', name: 'Hindernisse', desc: 'Jeder Apfel lässt irgendwo einen Stein wachsen.', stones: true },
    { id: 'portal',   icon: '🌀', name: 'Portale',     desc: 'Zwei Portale verbinden das Feld – rein und woanders wieder raus.', portals: true },
    { id: 'poison',   icon: '☠️', name: 'Gift',        desc: 'Lila Äpfel sind giftig und springen bei jedem Bissen woanders hin.', poison: true },
    { id: 'turbo',    icon: '⚡', name: 'Turbo',       desc: 'Mit jedem Apfel wird die Schlange schneller.', turbo: true },
    { id: 'time',     icon: '⏱️', name: 'Zeitrennen',  desc: '60 Sekunden – friss so viele Äpfel wie möglich.', time: 60 },
    { id: 'peaceful', icon: '🕊️', name: 'Friedlich',   desc: 'Kein Game Over: keine Wände und du kannst durch dich selbst.', wrap: true, peaceful: true },
    { id: 'duo',      icon: '👥', name: '2 Spieler',   desc: 'WASD gegen Pfeiltasten an einer Tastatur. Wer crasht, verliert.', duo: true },
  ];
  const SPEEDS = { slow: 165, normal: 125, fast: 88 };
  const SIZES = { s: [10, 9], m: [17, 15], l: [24, 21] };
  const COLORS = {
    blue:   { hex: '#4e7cf6', name: 'Blau' },
    purple: { hex: '#9a5cf0', name: 'Lila' },
    pink:   { hex: '#ef4f8b', name: 'Pink' },
    orange: { hex: '#f58a1f', name: 'Orange' },
    yellow: { hex: '#f4c20d', name: 'Gelb' },
    black:  { hex: '#3d4451', name: 'Schwarz' },
  };
  const DIRS = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
  // [Spieler im 2-Spieler-Modus, Richtung]
  const KEYS = {
    KeyW: [0, 'up'], KeyS: [0, 'down'], KeyA: [0, 'left'], KeyD: [0, 'right'],
    ArrowUp: [1, 'up'], ArrowDown: [1, 'down'], ArrowLeft: [1, 'left'], ArrowRight: [1, 'right'],
  };
  const GRASS = ['#aad751', '#a2d149'];

  const settings = Object.assign({ mode: 'classic', speed: 'normal', size: 'm', apples: 1, color: 'blue' }, store.get('settings', {}));
  if (!MODES.some((m) => m.id === settings.mode)) settings.mode = 'classic';
  if (!SPEEDS[settings.speed]) settings.speed = 'normal';
  if (!SIZES[settings.size]) settings.size = 'm';
  if (![1, 3, 5].includes(settings.apples)) settings.apples = 1;
  if (!COLORS[settings.color]) settings.color = 'blue';
  const saveSettings = () => store.set('settings', settings);

  /* ---------- Sound (Web Audio, ohne Dateien) ---------- */
  const Sound = {
    ac: null,
    on: store.get('sound', true),
    init() {
      if (!this.ac) { try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
      if (this.ac.state === 'suspended') this.ac.resume();
    },
    tone(f, dur, type = 'sine', vol = 0.06, to = 0, delay = 0) {
      if (!this.on || !this.ac) return;
      const t0 = this.ac.currentTime + delay, o = this.ac.createOscillator(), g = this.ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t0);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(this.ac.destination);
      o.start(t0); o.stop(t0 + dur + 0.05);
    },
    eat()    { this.tone(587, 0.07, 'square', 0.035); this.tone(880, 0.09, 'square', 0.035, 0, 0.06); },
    start()  { this.tone(440, 0.08, 'triangle', 0.07); this.tone(660, 0.1, 'triangle', 0.07, 0, 0.07); },
    crash()  { this.tone(220, 0.45, 'sawtooth', 0.05, 55); },
    poison() { this.tone(500, 0.5, 'sine', 0.07, 90); this.tone(510, 0.5, 'triangle', 0.04, 95, 0.05); },
    portal() { this.tone(260, 0.22, 'sine', 0.08, 1100); },
    stone()  { this.tone(140, 0.12, 'triangle', 0.09, 70, 0.12); },
    tick()   { this.tone(1200, 0.04, 'square', 0.025); },
    timeup() { [880, 660, 440].forEach((f, i) => this.tone(f, 0.16, 'triangle', 0.07, 0, i * 0.14)); },
    win()    { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.07, 0, i * 0.12)); },
  };

  /* ---------- Elemente ---------- */
  const el = {
    app: $('#app'), hud: $('#hud'), frame: $('#frame'), canvas: $('#board'), hint: $('#hint'), overlay: $('#overlay'),
    menu: $('#menu'), modes: $('#modes'), modeDesc: $('#mode-desc'), swatches: $('#swatches'), close: $('#menu-close'),
    help: $('#help'), play: $('#play'),
    score: $('#score'), best: $('#best'), sScore: $('#s-score'), sBest: $('#s-best'),
    sP1: $('#s-p1'), sP2: $('#s-p2'), p1: $('#p1'), p2: $('#p2'), p1dot: $('#p1dot'), p2dot: $('#p2dot'),
    sTime: $('#s-time'), time: $('#time'), modeLabel: $('#mode-label'),
    btnSound: $('#btn-sound'), btnPause: $('#btn-pause'), btnMenu: $('#btn-menu'),
  };
  const ctx = el.canvas.getContext('2d');
  const bg = document.createElement('canvas');
  const ICON = {
    apple: '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 9.5c-1.6-1.6-4.6-2.6-7.6-1.2C4.6 10 4 15 5.4 19.4 6.9 24 10 28 13 28c1.4 0 1.9-.6 3-.6s1.6.6 3 .6c3 0 6.1-4 7.6-8.6C28 15 27.4 10 23.6 8.3c-3-1.4-6-.4-7.6 1.2z" fill="#e7471d"/><ellipse cx="10.4" cy="14.5" rx="1.6" ry="3" fill="#fff" opacity=".5" transform="rotate(20 10.4 14.5)"/><path d="M16 9.6c0-2.6.6-4.4 2.2-5.8" stroke="#6b4226" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M18.4 5.6c1.8-2.2 5-2.6 6.6-1.4-1.4 2.4-4.6 3-6.6 1.4z" fill="#5aa63a"/></svg>',
    trophy: '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 7H5v2.5a5 5 0 0 0 5 5M23 7h4v2.5a5 5 0 0 1-5 5" fill="none" stroke="#ffc83d" stroke-width="2.6" stroke-linecap="round"/><path d="M8 4h16v7a8 8 0 0 1-16 0z" fill="#ffc83d"/><path d="M13.5 18h5v5h-5z" fill="#ffc83d"/><rect x="9.5" y="23" width="13" height="5" rx="2" fill="#ffc83d"/><path d="M12 7v4a4 4 0 0 0 2 3.4" stroke="#fff" stroke-opacity=".55" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',
    clock: '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="18" r="10" fill="#fff"/><path d="M16 18v-5.5M16 18l3.5 2.5" stroke="#4a752c" stroke-width="2.4" stroke-linecap="round"/><rect x="13" y="3" width="6" height="4" rx="1.5" fill="#fff"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.6"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.9l10.2-6.4a1 1 0 0 0 0-1.8L9.5 4.7A1 1 0 0 0 8 5.6z"/></svg>',
    soundOn: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9.2v5.6h3.6l4.9 4V5.2l-4.9 4z"/><path d="M15.5 8.8a4.6 4.6 0 0 1 0 6.4M18.3 6.2a8.4 8.4 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    soundOff: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9.2v5.6h3.6l4.9 4V5.2l-4.9 4z"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    menu: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M4.5 12h15M4.5 17h15" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>',
  };

  let G = null;            // aktuelles Spiel
  let started = false;     // schon einmal aus dem Menü gestartet?
  let cell = 20, boardW = 0, boardH = 0, dpr = 1;
  const duoWins = [0, 0];

  /* ---------- Spiel aufbauen ---------- */
  function makeSnake(hx, y, d, colorKey, now) {
    const body = [0, 1, 2].map((i) => ({ x: hx - d.x * i, y: y - d.y * i, d, j: null }));
    return {
      body, prevTail: null, grew: true, moved: false, dir: d, queue: [], ate: false,
      color: COLORS[colorKey].hex, name: COLORS[colorKey].name, alive: true, deadAt: 0, score: 0,
      blinkAt: now + 1200 + Math.random() * 2000,
    };
  }

  function newGame() {
    const mode = MODES.find((m) => m.id === settings.mode) || MODES[0];
    const [cols, rows] = SIZES[settings.size];
    const base = SPEEDS[settings.speed];
    const best = mode.duo ? 0 : store.get('best.' + mode.id, 0);
    const now = performance.now();
    G = {
      mode, cols, rows, base, interval: base, acc: 0, tick: 0, state: 'ready',
      snakes: [], apples: [], poison: [], stones: [], portals: [], eaten: [], particles: [], floaters: [],
      timeLeft: (mode.time || 0) * 1000, lastSec: null, shake: 0, overAt: 0, result: null, best, prevBest: best,
    };
    const g = G;
    const hx = Math.max(3, Math.floor(cols / 4)), mid = Math.floor(rows / 2);
    if (mode.duo) {
      const c2 = settings.color === 'orange' ? 'blue' : 'orange';
      g.snakes.push(makeSnake(hx, Math.floor(rows / 3), DIRS.right, settings.color, now));
      g.snakes.push(makeSnake(cols - 1 - hx, rows - 1 - Math.floor(rows / 3), DIRS.left, c2, now));
      g.apples.push({ x: Math.floor(cols / 2), y: mid, born: now });
    } else {
      g.snakes.push(makeSnake(hx, mid, DIRS.right, settings.color, now));
      g.apples.push({ x: cols - 1 - hx, y: mid, born: now });
    }
    if (mode.portals) placePortals(now);
    const want = mode.duo ? Math.max(2, settings.apples) : settings.apples;
    while (g.apples.length < want && spawn('apples'));
    if (mode.poison) refreshPoison(0);
    hideOverlay();
    updateHud();
    layout();
    showHint();
  }

  function occupied() {
    const g = G, set = new Set(), add = (c) => set.add(c.y * g.cols + c.x);
    for (const s of g.snakes) s.body.forEach(add);
    g.apples.forEach(add); g.poison.forEach(add); g.stones.forEach(add); g.portals.forEach(add);
    return set;
  }

  // Legt ein Objekt auf ein freies Feld. safe > 0: Mindestabstand zu den Köpfen und nicht direkt vor die Schlange.
  function spawn(kind, safe = 0) {
    const g = G, occ = occupied(), cells = [];
    for (let y = 0; y < g.rows; y++) {
      for (let x = 0; x < g.cols; x++) {
        if (occ.has(y * g.cols + x)) continue;
        if (safe && g.snakes.some((s) => {
          const h = s.body[0];
          if (Math.abs(h.x - x) + Math.abs(h.y - y) < safe) return true;
          for (let k = 1; k <= 5; k++) if (h.x + s.dir.x * k === x && h.y + s.dir.y * k === y) return true;
          return false;
        })) continue;
        cells.push({ x, y });
      }
    }
    if (!cells.length) return false;
    const c = cells[rand(cells.length)];
    g[kind].push({ x: c.x, y: c.y, born: performance.now() });
    return true;
  }

  function refreshPoison(score) {
    G.poison = [];
    const n = clamp(1 + Math.floor(score / 3), 1, 6);
    for (let i = 0; i < n; i++) spawn('poison', 3);
  }

  function placePortals(now) {
    const g = G, avoid = new Set(g.snakes.map((s) => s.body[0].y)), cand = [];
    for (let y = 2; y < g.rows - 2; y++) {
      if (avoid.has(y)) continue;
      for (let x = 2; x < g.cols - 2; x++) cand.push({ x, y });
    }
    const minD = Math.floor((g.cols + g.rows) / 3);
    for (let i = 0; i < 300 && cand.length > 1; i++) {
      const a = cand[rand(cand.length)], b = cand[rand(cand.length)];
      if (Math.abs(a.x - b.x) + Math.abs(a.y - b.y) >= minD) {
        g.portals = [{ x: a.x, y: a.y, born: now }, { x: b.x, y: b.y, born: now }];
        return;
      }
    }
    g.portals = [{ x: 2, y: 2, born: now }, { x: g.cols - 3, y: g.rows - 3, born: now }];
  }

  function portalExit(x, y) {
    const p = G.portals;
    if (p.length !== 2) return null;
    if (p[0].x === x && p[0].y === y) return p[1];
    if (p[1].x === x && p[1].y === y) return p[0];
    return null;
  }

  /* ---------- Spiellogik ---------- */
  function input(idx, d) {
    const g = G;
    if (!g || !el.menu.classList.contains('hidden')) return;
    if (g.state !== 'ready' && g.state !== 'play') return;
    const s = g.snakes[idx];
    if (!s || !s.alive) return;
    const last = s.queue.length ? s.queue[s.queue.length - 1] : s.dir;
    const same = d.x === last.x && d.y === last.y, back = d.x === -last.x && d.y === -last.y;
    if (s.queue.length < 3 && !same && !back) s.queue.push(d);
    if (g.state === 'ready') begin();
  }

  function begin() {
    const g = G;
    if (g.state !== 'ready') return;
    g.state = 'play';
    g.acc = 0;
    el.hint.classList.add('hidden');
    Sound.start();
    step(performance.now());
    updateHud();
  }

  function step(now) {
    const g = G, m = g.mode;
    g.tick++;
    g.eaten = [];
    const inside = (x, y) => x >= 0 && y >= 0 && x < g.cols && y < g.rows;
    const key = (x, y) => y * g.cols + x;
    const live = g.snakes.filter((s) => s.alive);
    for (const s of live) if (s.queue.length) s.dir = s.queue.shift();

    // Zielfeld jeder Schlange
    const plans = live.map((s) => {
      const h = s.body[0], d = s.dir;
      let x = h.x + d.x, y = h.y + d.y, j = null;
      const exit = portalExit(h.x, h.y);
      if (exit) { x = exit.x + d.x; y = exit.y + d.y; j = 'portal'; }
      if (m.wrap && !inside(x, y)) { x = (x + g.cols) % g.cols; y = (y + g.rows) % g.rows; j = j || 'wrap'; }
      const apple = g.apples.find((a) => a.x === x && a.y === y) || null;
      return { s, x, y, d, j, apple, dead: null };
    });

    // Belegung nach dem Zug (der Schwanz rückt nach, außer beim Wachsen)
    const occ = new Set(), heads = new Map();
    for (const p of plans) {
      const keep = p.apple ? p.s.body.length : p.s.body.length - 1;
      for (let i = 0; i < keep; i++) occ.add(key(p.s.body[i].x, p.s.body[i].y));
      if (inside(p.x, p.y)) heads.set(key(p.x, p.y), (heads.get(key(p.x, p.y)) || 0) + 1);
    }
    for (const p of plans) {
      if (!inside(p.x, p.y)) p.dead = 'wall';
      else if (g.stones.some((c) => c.x === p.x && c.y === p.y)) p.dead = 'stone';
      else if (!m.peaceful && occ.has(key(p.x, p.y))) p.dead = 'body';
      else if (heads.get(key(p.x, p.y)) > 1) p.dead = 'head';
    }

    let ended = null;
    for (const p of plans) {
      const s = p.s;
      if (p.dead) {
        s.alive = false; s.moved = false; s.deadAt = now;
        const h = s.body[0];
        burst(h.x + p.d.x * 0.45, h.y + p.d.y * 0.45, ['#ffffff', '#e4f1d2', '#a5a5a5'], 0, now, 10);
        ended = 'crash';
        continue;
      }
      s.body.unshift({ x: p.x, y: p.y, d: p.d, j: p.j });
      if (p.apple) { s.grew = true; s.prevTail = null; }
      else { s.grew = false; s.prevTail = s.body.pop(); }
      s.moved = true; s.ate = false;
      if (p.j === 'portal') Sound.portal();
    }
    for (const p of plans) {
      if (p.dead) continue;
      const s = p.s;
      if (p.apple) eat(s, p.apple, now);
      const poison = g.poison.find((c) => c.x === p.x && c.y === p.y);
      if (poison) {
        g.poison.splice(g.poison.indexOf(poison), 1);
        g.eaten.push({ x: poison.x, y: poison.y, kind: 'poison', tick: g.tick });
        burst(poison.x, poison.y, ['#8e3fc4', '#c58cf2', '#55197f'], g.interval * 0.4, now, 14);
        s.alive = false; s.deadAt = now + g.interval * 0.5;
        ended = 'poison';
      }
    }
    if (!ended && g.apples.length === 0) ended = 'win';
    if (ended) endGame(ended);
    updateHud();
  }

  function eat(s, apple, now) {
    const g = G, m = g.mode;
    g.apples.splice(g.apples.indexOf(apple), 1);
    g.eaten.push({ x: apple.x, y: apple.y, kind: 'apple', tick: g.tick });
    s.score++;
    s.ate = true;
    const delay = g.interval * 0.45;
    burst(apple.x, apple.y, ['#e7471d', '#ff8559', '#ffd54f', '#7cc04a'], delay, now, 12);
    g.floaters.push({ x: apple.x + 0.5, y: apple.y - 0.1, text: '+1', born: now + delay, life: 750, color: m.duo ? s.color : '#ffffff' });
    Sound.eat();
    if (!m.duo && s.score > g.best) { g.best = s.score; store.set('best.' + m.id, g.best); }
    if (m.turbo) {
      const old = g.interval;
      g.interval = Math.max(50, Math.round(g.base * Math.pow(0.97, s.score)));
      g.acc *= g.interval / old;
    }
    spawn('apples');
    if (m.stones && spawn('stones', 4)) {
      const st = g.stones[g.stones.length - 1];
      burst(st.x, st.y, ['#9e9e9e', '#d0d0d0', '#7a7a7a'], 0, now, 8);
      Sound.stone();
    }
    if (m.poison) refreshPoison(s.score);
    bump(m.duo ? (s === g.snakes[0] ? el.sP1 : el.sP2) : el.sScore);
  }

  function burst(x, y, colors, delay, now, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 0.8 + Math.random() * 1.8;
      G.particles.push({
        x: x + 0.5, y: y + 0.5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
        born: now + delay, life: 420 + Math.random() * 280, color: colors[i % colors.length], r: 0.05 + Math.random() * 0.07,
      });
    }
  }

  function endGame(reason) {
    const g = G;
    if (g.state === 'over') return;
    g.state = 'over';
    g.result = reason;
    g.overAt = performance.now();
    if (reason === 'win') Sound.win();
    else if (reason === 'time') Sound.timeup();
    else if (reason === 'poison') Sound.poison();
    else { Sound.crash(); g.shake = 380; }
    if (g.mode.duo) {
      const [a, b] = g.snakes;
      if (a.alive && !b.alive) duoWins[0]++;
      else if (b.alive && !a.alive) duoWins[1]++;
    }
    updateHud();
    setTimeout(() => {
      if (G === g && el.menu.classList.contains('hidden')) showGameOver();
    }, reason === 'time' || reason === 'win' ? 500 : 950);
  }

  function update(dt, now) {
    const g = G;
    if (!g) return;
    if (g.state === 'play') {
      if (g.mode.time) {
        g.timeLeft = Math.max(0, g.timeLeft - dt);
        const sec = Math.ceil(g.timeLeft / 1000);
        if (sec !== g.lastSec) { g.lastSec = sec; updateTime(); if (sec > 0 && sec <= 5) Sound.tick(); }
        if (g.timeLeft <= 0) endGame('time');
      }
      g.acc += dt;
      while (g.state === 'play' && g.acc >= g.interval) { g.acc -= g.interval; step(now); }
    } else if (g.state === 'over') {
      g.acc = Math.min(g.interval, g.acc + dt);
    }
    if (g.shake > 0) g.shake = Math.max(0, g.shake - dt);
    for (const s of g.snakes) if (now > s.blinkAt + 140) s.blinkAt = now + 2200 + Math.random() * 3800;
  }

  /* ---------- Zeichnen ---------- */
  function layout() {
    const g = G;
    if (!g) return;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const pad = 10;
    const vw = document.documentElement.clientWidth, vh = window.innerHeight;
    const hudH = el.hud.offsetHeight || 54;
    const dpadH = isTouch && vh >= vw ? 3 * 52 + 2 * 6 + 12 : 0;
    const availW = Math.min(vw - 16, 760) - pad * 2;
    const availH = vh - hudH - dpadH - 16 - pad * 2;
    cell = Math.max(8, Math.floor(Math.min(availW / g.cols, availH / g.rows)));
    boardW = cell * g.cols;
    boardH = cell * g.rows;
    el.canvas.style.width = boardW + 'px';
    el.canvas.style.height = boardH + 'px';
    el.canvas.width = Math.round(boardW * dpr);
    el.canvas.height = Math.round(boardH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    el.app.style.width = boardW + pad * 2 + 'px';
    renderBackground();
  }

  // Rasen im Schachbrettmuster mit feinen Grashalmen (einmal vorgezeichnet)
  function renderBackground() {
    const g = G;
    bg.width = Math.round(boardW * dpr);
    bg.height = Math.round(boardH * dpr);
    const b = bg.getContext('2d');
    b.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (let y = 0; y < g.rows; y++) {
      for (let x = 0; x < g.cols; x++) {
        b.fillStyle = GRASS[(x + y) & 1];
        b.fillRect(x * cell, y * cell, cell, cell);
      }
    }
    const r = seeded(g.cols * 131 + g.rows);
    b.strokeStyle = 'rgba(60, 110, 25, 0.13)';
    b.lineWidth = Math.max(1, cell * 0.04);
    b.lineCap = 'round';
    for (let y = 0; y < g.rows; y++) {
      for (let x = 0; x < g.cols; x++) {
        if (r() > 0.22) continue;
        const bx = (x + 0.2 + r() * 0.6) * cell, by = (y + 0.35 + r() * 0.5) * cell;
        for (let k = -1; k <= 1; k++) {
          b.beginPath();
          b.moveTo(bx + k * cell * 0.06, by);
          b.lineTo(bx + k * cell * 0.11, by - cell * (0.1 + r() * 0.08));
          b.stroke();
        }
      }
    }
  }

  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function render(now) {
    const g = G;
    if (!g) return;
    const t = clamp(g.acc / g.interval, 0, 1);
    ctx.save();
    ctx.clearRect(0, 0, boardW, boardH);
    if (g.shake > 0 && !reduceMotion) {
      const k = (g.shake / 380) * cell * 0.16;
      ctx.translate((Math.random() * 2 - 1) * k, (Math.random() * 2 - 1) * k);
    }
    ctx.drawImage(bg, 0, 0, boardW, boardH);
    if (g.mode.wrap) {
      const lw = Math.max(2, cell * 0.07);
      ctx.save();
      ctx.setLineDash([cell * 0.28, cell * 0.22]);
      ctx.lineWidth = lw;
      ctx.strokeStyle = 'rgba(255,255,255,0.45)';
      ctx.strokeRect(lw / 2, lw / 2, boardW - lw, boardH - lw);
      ctx.restore();
    }
    g.stones.forEach((s) => drawStone(s, now));
    g.poison.forEach((a) => drawApple(a, 'poison', now));
    g.apples.forEach((a) => drawApple(a, 'apple', now));
    for (const e of g.eaten) {
      if (e.tick === g.tick && t < 0.5) drawAppleShape((e.x + 0.5) * cell, (e.y + 0.5) * cell, cell * 0.36 * (1 - t / 0.5), e.kind);
    }
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, boardW, boardH);
    ctx.clip();
    for (const s of g.snakes) drawSnake(s, s.moved ? t : 1, now);
    ctx.restore();
    // Portale über der Schlange: sie kriecht sichtbar hinein und kommt woanders heraus
    g.portals.forEach((p, i) => drawPortal(p, i, now));
    drawFx(now);
    ctx.restore();
  }

  function drawApple(a, kind, now) {
    const age = now - a.born;
    let k = age < 280 ? easeOutBack(age / 280) : 1;
    k *= 1 + Math.sin(now / 280 + a.x * 1.3 + a.y * 0.7) * 0.035;
    drawAppleShape((a.x + 0.5) * cell, (a.y + 0.5) * cell, cell * 0.36 * k, kind);
  }

  function drawAppleShape(x, y, r, kind) {
    if (r < 0.5) return;
    const pal = kind === 'poison'
      ? { base: '#8e3fc4', light: '#c58cf2', dark: '#55197f', leaf: '#3c6b22' }
      : { base: '#e7471d', light: '#ff8559', dark: '#b2290c', leaf: '#5aa63a' };
    ctx.fillStyle = 'rgba(0,0,0,0.17)';
    ctx.beginPath();
    ctx.ellipse(x + r * 0.08, y + r * 0.92, r * 0.8, r * 0.26, 0, 0, Math.PI * 2);
    ctx.fill();
    const gr = ctx.createRadialGradient(x - r * 0.35, y - r * 0.3, r * 0.1, x, y, r * 1.15);
    gr.addColorStop(0, pal.light);
    gr.addColorStop(0.55, pal.base);
    gr.addColorStop(1, pal.dark);
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.moveTo(x, y - r * 0.55);
    ctx.bezierCurveTo(x + r * 0.5, y - r * 1.05, x + r * 1.15, y - r * 0.45, x + r * 0.95, y + r * 0.2);
    ctx.bezierCurveTo(x + r * 0.8, y + r * 0.85, x + r * 0.35, y + r * 1.0, x, y + r * 0.85);
    ctx.bezierCurveTo(x - r * 0.35, y + r * 1.0, x - r * 0.8, y + r * 0.85, x - r * 0.95, y + r * 0.2);
    ctx.bezierCurveTo(x - r * 1.15, y - r * 0.45, x - r * 0.5, y - r * 1.05, x, y - r * 0.55);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.42)';
    ctx.beginPath();
    ctx.ellipse(x - r * 0.45, y - r * 0.12, r * 0.13, r * 0.27, 0.35, 0, Math.PI * 2);
    ctx.fill();
    if (kind === 'poison') {
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      for (const [sx, sy, sr] of [[0.35, 0.1, 0.13], [-0.05, 0.5, 0.1], [0.05, -0.2, 0.08], [0.55, 0.5, 0.07]]) {
        ctx.beginPath();
        ctx.arc(x + r * sx, y + r * sy, r * sr, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.strokeStyle = '#6b4226';
    ctx.lineWidth = Math.max(1, r * 0.17);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y - r * 0.5);
    ctx.quadraticCurveTo(x + r * 0.02, y - r * 0.85, x + r * 0.2, y - r * 1.05);
    ctx.stroke();
    ctx.fillStyle = pal.leaf;
    ctx.beginPath();
    ctx.ellipse(x + r * 0.45, y - r * 0.88, r * 0.32, r * 0.14, -0.55, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawStone(s, now) {
    const age = now - s.born, k = age < 320 ? easeOutBack(age / 320) : 1;
    const h = cell * 0.43 * k;
    if (h < 0.5) return;
    const cx = (s.x + 0.5) * cell, cy = (s.y + 0.5) * cell, r = h * 0.42;
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    rrect(cx - h + cell * 0.04, cy - h + cell * 0.09, h * 2, h * 2, r);
    ctx.fill();
    const gr = ctx.createLinearGradient(cx - h, cy - h, cx + h, cy + h);
    gr.addColorStop(0, '#c4c4c4');
    gr.addColorStop(1, '#727272');
    ctx.fillStyle = gr;
    rrect(cx - h, cy - h, h * 2, h * 2, r);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    rrect(cx - h * 0.68, cy - h * 0.72, h * 0.95, h * 0.34, h * 0.17);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.22)';
    ctx.lineWidth = Math.max(1, cell * 0.035);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx + h * 0.15, cy - h * 0.1);
    ctx.lineTo(cx + h * 0.35, cy + h * 0.2);
    ctx.lineTo(cx + h * 0.2, cy + h * 0.5);
    ctx.stroke();
  }

  function drawPortal(p, i, now) {
    const age = now - p.born, k = age < 420 ? easeOutBack(age / 420) : 1;
    const r = cell * 0.52 * k;
    if (r < 0.5) return;
    const cx = (p.x + 0.5) * cell, cy = (p.y + 0.5) * cell;
    const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    gr.addColorStop(0, '#0d0426');
    gr.addColorStop(0.5, '#3a1896');
    gr.addColorStop(0.78, '#7c4dff');
    gr.addColorStop(1, 'rgba(124,77,255,0)');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate((now / 450) * (i ? -1 : 1));
    ctx.strokeStyle = 'rgba(215,200,255,0.9)';
    ctx.lineWidth = Math.max(1.5, cell * 0.055);
    ctx.lineCap = 'round';
    for (let n = 0; n < 3; n++) {
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.6, n * 2.094, n * 2.094 + 1.15);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Sichtbarer Körper als Linienzüge (in Feld-Koordinaten). Die Darstellung läuft der Logik
  // um einen Schritt hinterher: t = 0 zeigt den alten Zustand, t = 1 den aktuellen.
  // Rand- und Portalsprünge teilen den Körper in mehrere Stücke.
  function snakePieces(s, t) {
    const pts = s.body.slice();
    const tail = !s.grew && s.prevTail;
    if (tail) pts.push(s.prevTail);
    const segs = [];
    let brk = false;
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1], d = a.d;
      if (a.j === 'wrap') {
        segs.push({ ax: a.x, ay: a.y, bx: a.x - d.x * 0.5, by: a.y - d.y * 0.5, len: 0.5, brk });
        segs.push({ ax: b.x + d.x * 0.5, ay: b.y + d.y * 0.5, bx: b.x, by: b.y, len: 0.5, brk: true });
        brk = false;
      } else if (a.j === 'portal') {
        segs.push({ ax: a.x, ay: a.y, bx: a.x - d.x, by: a.y - d.y, len: 1, brk });
        brk = true;
      } else {
        segs.push({ ax: a.x, ay: a.y, bx: b.x, by: b.y, len: 1, brk });
        brk = false;
      }
    }
    const start = 1 - t;
    const end = pts.length - 1 - (tail ? t : 0);
    const pieces = [];
    let cur = null, u = 0;
    for (const sg of segs) {
      const u0 = u, u1 = u + sg.len;
      u = u1;
      if (sg.brk) cur = null;
      if (u1 < start - 1e-9 || u0 > end + 1e-9) continue;
      const f0 = clamp((start - u0) / sg.len, 0, 1), f1 = clamp((end - u0) / sg.len, 0, 1);
      const p0 = { x: sg.ax + (sg.bx - sg.ax) * f0, y: sg.ay + (sg.by - sg.ay) * f0 };
      const p1 = { x: sg.ax + (sg.bx - sg.ax) * f1, y: sg.ay + (sg.by - sg.ay) * f1 };
      if (!cur) { cur = [p0]; pieces.push(cur); }
      cur.push(p1);
    }
    return pieces;
  }

  function drawSnake(s, t, now) {
    const pieces = snakePieces(s, t);
    if (!pieces.length) return;
    const c = cell, lw = c * 0.74;
    let col = s.color;
    if (!s.alive && now >= s.deadAt) {
      const since = now - s.deadAt;
      col = since < 800 && Math.floor(since / 100) % 2 === 0 ? mix(s.color, '#ffffff', 0.6) : mix(s.color, '#7d7d7d', 0.4);
    }
    const stroke = (style, w, ox, oy) => {
      ctx.strokeStyle = style;
      ctx.fillStyle = style;
      ctx.lineWidth = w;
      for (const pc of pieces) {
        const x0 = (pc[0].x + 0.5) * c + ox, y0 = (pc[0].y + 0.5) * c + oy;
        let len = 0;
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        for (let i = 1; i < pc.length; i++) {
          const x = (pc[i].x + 0.5) * c + ox, y = (pc[i].y + 0.5) * c + oy;
          len += Math.abs(x - x0) + Math.abs(y - y0);
          ctx.lineTo(x, y);
        }
        if (len > 0.01) ctx.stroke();
        else { ctx.beginPath(); ctx.arc(x0, y0, w / 2, 0, Math.PI * 2); ctx.fill(); }
      }
    };
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    stroke('rgba(0,0,0,0.17)', lw, c * 0.04, c * 0.09);           // Schatten
    stroke(col, lw, 0, 0);                                        // Körper
    stroke('rgba(255,255,255,0.2)', lw * 0.3, -lw * 0.13, -lw * 0.15); // Glanz
    drawHead(s, pieces[0][0], col, t, now);
  }

  function lookDir(s) {
    const h = s.body[0];
    let best = null, bd = Infinity;
    for (const a of G.apples) {
      const d = Math.abs(a.x - h.x) + Math.abs(a.y - h.y);
      if (d < bd) { bd = d; best = a; }
    }
    if (!best) return h.d;
    const vx = best.x - h.x, vy = best.y - h.y, l = Math.hypot(vx, vy) || 1;
    return { x: vx / l, y: vy / l };
  }

  // Maul geht auf, wenn im nächsten Schritt ein Apfel kommt, und schließt sich beim Schlucken.
  function mouthOpen(s, t) {
    if (s.ate) return clamp(1 - t * 1.8, 0, 1);
    const g = G, h = s.body[0], d = s.queue[0] || s.dir;
    let x = h.x + d.x, y = h.y + d.y;
    const exit = portalExit(h.x, h.y);
    if (exit) { x = exit.x + d.x; y = exit.y + d.y; }
    if (g.mode.wrap) { x = (x + g.cols) % g.cols; y = (y + g.rows) % g.rows; }
    return g.apples.some((a) => a.x === x && a.y === y) ? clamp(t * 1.4, 0, 1) : 0;
  }

  function drawHead(s, p, col, t, now) {
    const c = cell, d = s.body[0].d;
    const cx = (p.x + 0.5) * c, cy = (p.y + 0.5) * c, r = c * 0.43;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    const dead = !s.alive && now >= s.deadAt;
    const mouth = dead ? 0 : mouthOpen(s, t);
    if (mouth > 0.03) {
      const a = Math.atan2(d.y, d.x), m = mouth * 0.7;
      ctx.fillStyle = '#7a1f2e';
      ctx.beginPath();
      ctx.moveTo(cx + d.x * r * 0.15, cy + d.y * r * 0.15);
      ctx.arc(cx, cy, r * 0.92, a - m, a + m);
      ctx.closePath();
      ctx.fill();
    }
    const px = -d.y, py = d.x;
    const er = c * 0.135, pr = c * 0.07;
    const look = lookDir(s);
    const blink = s.alive && now > s.blinkAt && now < s.blinkAt + 140;
    for (const side of [-1, 1]) {
      const ex = cx + px * side * c * 0.2 + d.x * c * 0.04;
      const ey = cy + py * side * c * 0.2 + d.y * c * 0.04;
      ctx.lineCap = 'round';
      if (dead) {
        const q = er * 0.75;
        ctx.strokeStyle = '#2a2a2a';
        ctx.lineWidth = Math.max(1.5, c * 0.045);
        ctx.beginPath();
        ctx.moveTo(ex - q, ey - q); ctx.lineTo(ex + q, ey + q);
        ctx.moveTo(ex + q, ey - q); ctx.lineTo(ex - q, ey + q);
        ctx.stroke();
        continue;
      }
      if (blink) {
        ctx.strokeStyle = '#1f2a44';
        ctx.lineWidth = Math.max(1.2, c * 0.04);
        ctx.beginPath();
        ctx.moveTo(ex - d.x * er, ey - d.y * er);
        ctx.lineTo(ex + d.x * er, ey + d.y * er);
        ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ex, ey, er, 0, Math.PI * 2);
      ctx.fill();
      const qx = ex + look.x * er * 0.42, qy = ey + look.y * er * 0.42;
      ctx.fillStyle = '#1b1b1b';
      ctx.beginPath();
      ctx.arc(qx, qy, pr, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.arc(qx - pr * 0.35, qy - pr * 0.35, pr * 0.35, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawFx(now) {
    const g = G, c = cell;
    g.particles = g.particles.filter((p) => now - p.born < p.life);
    for (const p of g.particles) {
      const ms = now - p.born;
      if (ms < 0) continue;
      const a = ms / 1000, k = 1 - ms / p.life;
      ctx.globalAlpha = k;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc((p.x + p.vx * a) * c, (p.y + p.vy * a + 2.5 * a * a) * c, Math.max(0.5, p.r * c * (0.5 + 0.5 * k)), 0, Math.PI * 2);
      ctx.fill();
    }
    g.floaters = g.floaters.filter((f) => now - f.born < f.life);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `700 ${Math.round(c * 0.55)}px Fredoka, system-ui, sans-serif`;
    ctx.lineJoin = 'round';
    for (const f of g.floaters) {
      const ms = now - f.born;
      if (ms < 0) continue;
      const k = ms / f.life, x = f.x * c, y = (f.y - k * 0.9) * c;
      ctx.globalAlpha = 1 - k * k;
      ctx.lineWidth = Math.max(2, c * 0.1);
      ctx.strokeStyle = 'rgba(40,60,20,0.55)';
      ctx.strokeText(f.text, x, y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, x, y);
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- Anzeige: HUD, Hinweise, Overlays ---------- */
  function bump(node) {
    node.classList.remove('bump');
    void node.offsetWidth;
    node.classList.add('bump');
  }

  function updateTime() {
    const g = G;
    if (!g.mode.time) return;
    const s = Math.ceil(g.timeLeft / 1000);
    el.time.textContent = s;
    el.sTime.classList.toggle('warn', s <= 10 && g.state !== 'over');
  }

  function updateHud() {
    const g = G;
    if (!g) return;
    const duo = !!g.mode.duo;
    el.sScore.classList.toggle('hidden', duo);
    el.sBest.classList.toggle('hidden', duo);
    el.sP1.classList.toggle('hidden', !duo);
    el.sP2.classList.toggle('hidden', !duo);
    el.sTime.classList.toggle('hidden', !g.mode.time);
    if (duo) {
      const [a, b] = g.snakes;
      el.p1.textContent = a.score; el.p1dot.style.background = a.color;
      el.p2.textContent = b.score; el.p2dot.style.background = b.color;
    } else {
      el.score.textContent = g.snakes[0].score;
      el.best.textContent = g.best;
    }
    el.modeLabel.textContent = g.mode.icon + ' ' + g.mode.name;
    updateTime();
    const paused = g.state === 'pause';
    el.btnPause.innerHTML = paused ? ICON.play : ICON.pause;
    el.btnPause.setAttribute('aria-label', paused ? 'Weiter' : 'Pause');
  }

  function showHint() {
    const g = G, m = g.mode;
    let ctrl;
    if (m.duo) {
      const [a, b] = g.snakes;
      ctrl = `<i class="dot" style="background:${a.color}"></i> ${a.name}: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
        &nbsp; <i class="dot" style="background:${b.color}"></i> ${b.name}: <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd>`;
    } else if (isTouch) {
      ctrl = 'Wische oder tippe auf die Pfeile zum Starten';
    } else {
      ctrl = '<kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> oder <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> zum Starten';
    }
    el.hint.innerHTML = `<div class="ht">${m.icon} ${m.name}</div><div class="hd">${m.desc}</div><div>${ctrl}</div>`;
    el.hint.classList.remove('hidden');
  }

  function showOverlay(html) {
    el.overlay.innerHTML = `<div class="card">${html}</div>`;
    el.overlay.classList.remove('hidden');
  }
  function hideOverlay() {
    el.overlay.classList.add('hidden');
    el.overlay.innerHTML = '';
  }

  function showPause() {
    showOverlay(`<h2>Pause</h2><div class="sub">${G.mode.icon} ${G.mode.name}</div>
      <div class="btns">
        <button class="btn primary" type="button" data-act="resume">▶ Weiter</button>
        <button class="btn" type="button" data-act="restart">↻ Neustart</button>
        <button class="btn" type="button" data-act="menu">☰ Menü</button>
      </div>
      ${isTouch ? '' : '<div class="keys-hint">Leertaste oder Esc = Weiter</div>'}`);
  }

  function showGameOver() {
    const g = G;
    let html;
    if (g.mode.duo) {
      const [a, b] = g.snakes;
      let w = a.alive && !b.alive ? a : b.alive && !a.alive ? b : null;
      if (!w && g.result === 'win' && a.score !== b.score) w = a.score > b.score ? a : b;
      html = `<h2>${w ? `<i class="dot" style="background:${w.color}"></i> ${w.name} gewinnt!` : 'Unentschieden!'}</h2>
        <div class="scores">
          <div><i class="dot" style="background:${a.color}"></i>${a.score}</div>
          <div><i class="dot" style="background:${b.color}"></i>${b.score}</div>
        </div>
        <div class="sub" style="margin-top:10px">Siege: ${a.name} ${duoWins[0]} : ${duoWins[1]} ${b.name}</div>`;
    } else {
      const s = g.snakes[0];
      const title = { win: 'Gewonnen! 🎉', time: 'Zeit um!', poison: 'Vergiftet!' }[g.result] || 'Game Over';
      const record = s.score > g.prevBest && s.score > 0;
      html = `<h2>${title}</h2>
        <div class="scores"><div>${ICON.apple}${s.score}</div><div>${ICON.trophy}${g.best}</div></div>
        ${record ? '<div class="badge">Neuer Rekord!</div>' : ''}`;
    }
    html += `<div class="btns">
        <button class="btn primary" type="button" data-act="restart">↻ Nochmal</button>
        <button class="btn" type="button" data-act="menu">☰ Menü</button>
      </div>
      ${isTouch ? '' : '<div class="keys-hint">Leertaste = Nochmal · Esc = Menü</div>'}`;
    showOverlay(html);
  }

  function pause() {
    if (G.state !== 'play') return;
    G.state = 'pause';
    showPause();
    updateHud();
  }
  function resume() {
    if (G.state !== 'pause') return;
    G.state = 'play';
    hideOverlay();
    updateHud();
  }
  function restart() { newGame(); }

  /* ---------- Menü ---------- */
  function buildMenu() {
    el.modes.innerHTML = MODES.map((m) => `<button type="button" class="mode" data-mode="${m.id}">
        <span class="mi">${m.icon}</span><span class="mn">${m.name}</span><span class="mb"></span></button>`).join('');
    el.swatches.innerHTML = Object.entries(COLORS).map(([k, c]) =>
      `<button type="button" class="sw" data-color="${k}" style="background:${c.hex}" title="${c.name}" aria-label="${c.name}"></button>`).join('');
    el.help.textContent = isTouch
      ? 'Wischen oder die Pfeile unter dem Spielfeld tippen'
      : 'Pfeiltasten / WASD lenken · Leertaste = Pause · M = Ton an/aus · Enter = Spielen';
  }

  function syncMenu() {
    el.modes.querySelectorAll('.mode').forEach((b) => {
      const m = MODES.find((x) => x.id === b.dataset.mode);
      b.classList.toggle('on', m.id === settings.mode);
      b.querySelector('.mb').textContent = m.duo ? 'Tastatur' : '🏆 ' + store.get('best.' + m.id, 0);
    });
    el.modeDesc.textContent = MODES.find((m) => m.id === settings.mode).desc;
    document.querySelectorAll('.seg').forEach((seg) => {
      seg.querySelectorAll('button').forEach((b) => b.classList.toggle('on', String(settings[seg.dataset.setting]) === b.dataset.v));
    });
    el.swatches.querySelectorAll('.sw').forEach((b) => b.classList.toggle('on', b.dataset.color === settings.color));
    el.close.classList.toggle('hidden', !started);
  }

  function openMenu() {
    if (G && G.state === 'play') G.state = 'pause';
    hideOverlay();
    syncMenu();
    el.menu.classList.remove('hidden');
  }
  function closeMenu() {
    el.menu.classList.add('hidden');
    if (G.state === 'pause') showPause();
    else if (G.state === 'over') showGameOver();
    updateHud();
  }
  function startFromMenu() {
    started = true;
    el.menu.classList.add('hidden');
    newGame();
  }

  function toggleSound() {
    Sound.on = !Sound.on;
    store.set('sound', Sound.on);
    el.btnSound.innerHTML = Sound.on ? ICON.soundOn : ICON.soundOff;
    if (Sound.on) { Sound.init(); Sound.tone(660, 0.08, 'triangle', 0.06); }
  }

  /* ---------- Eingaben ---------- */
  document.addEventListener('keydown', (e) => {
    Sound.init();
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const g = G;
    if (!el.menu.classList.contains('hidden')) {
      if (e.code === 'Enter' || e.code === 'NumpadEnter' || e.code === 'Space') { e.preventDefault(); startFromMenu(); }
      else if (e.code === 'Escape' && started) { e.preventDefault(); closeMenu(); }
      return;
    }
    const k = KEYS[e.code];
    if (k) {
      e.preventDefault();
      input(g.mode.duo ? k[0] : 0, DIRS[k[1]]);
      return;
    }
    switch (e.code) {
      case 'Space': case 'Enter': case 'NumpadEnter':
        e.preventDefault();
        if (g.state === 'ready') begin();
        else if (g.state === 'play') { if (e.code === 'Space') pause(); }
        else if (g.state === 'pause') resume();
        else if (g.state === 'over' && performance.now() - g.overAt > 500) restart();
        break;
      case 'KeyP': case 'Escape':
        e.preventDefault();
        if (g.state === 'play') pause();
        else if (g.state === 'pause') resume();
        else if (g.state === 'over' && e.code === 'Escape') openMenu();
        break;
      case 'KeyM':
        toggleSound();
        break;
    }
  });

  // Wischen auf dem Spielbereich
  let swipe = null;
  el.app.addEventListener('touchstart', (e) => {
    Sound.init();
    if (e.target.closest('button') || e.touches.length !== 1) { swipe = null; return; }
    swipe = { x: e.touches[0].clientX, y: e.touches[0].clientY, moved: false };
  }, { passive: true });
  el.app.addEventListener('touchmove', (e) => {
    if (!swipe) return;
    e.preventDefault();
    const tp = e.touches[0], dx = tp.clientX - swipe.x, dy = tp.clientY - swipe.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
    input(0, Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? DIRS.right : DIRS.left) : (dy > 0 ? DIRS.down : DIRS.up));
    swipe = { x: tp.clientX, y: tp.clientY, moved: true };
  }, { passive: false });
  el.app.addEventListener('touchend', () => {
    if (swipe && !swipe.moved && G.state === 'ready') begin();
    swipe = null;
  });

  document.querySelectorAll('#dpad button').forEach((b) => {
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      Sound.init();
      input(0, DIRS[b.dataset.dir]);
    });
  });

  el.canvas.addEventListener('click', () => { if (G.state === 'ready') begin(); });
  el.overlay.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    ({ resume, restart, menu: openMenu })[b.dataset.act]();
  });
  el.btnPause.addEventListener('click', () => {
    if (G.state === 'play') pause();
    else if (G.state === 'pause') resume();
    else if (G.state === 'ready') begin();
  });
  el.btnSound.addEventListener('click', toggleSound);
  el.btnMenu.addEventListener('click', openMenu);

  el.modes.addEventListener('click', (e) => {
    const b = e.target.closest('[data-mode]');
    if (!b) return;
    settings.mode = b.dataset.mode;
    saveSettings();
    syncMenu();
  });
  el.modes.addEventListener('dblclick', (e) => { if (e.target.closest('[data-mode]')) startFromMenu(); });
  document.querySelectorAll('.seg').forEach((seg) => seg.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const k = seg.dataset.setting;
    settings[k] = k === 'apples' ? Number(b.dataset.v) : b.dataset.v;
    saveSettings();
    syncMenu();
  }));
  el.swatches.addEventListener('click', (e) => {
    const b = e.target.closest('[data-color]');
    if (!b) return;
    settings.color = b.dataset.color;
    saveSettings();
    syncMenu();
  });
  el.play.addEventListener('click', startFromMenu);
  el.close.addEventListener('click', closeMenu);

  // Fokus nach Mausklick wieder abgeben, damit Leertaste/Enter nicht den Button erneut auslösen
  document.addEventListener('click', (e) => {
    const b = e.target.closest && e.target.closest('button');
    if (b) b.blur();
  });
  document.addEventListener('pointerdown', () => Sound.init());
  document.addEventListener('visibilitychange', () => { if (document.hidden && G && G.state === 'play') pause(); });
  window.addEventListener('resize', layout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

  /* ---------- Start ---------- */
  document.body.classList.toggle('touch', isTouch);
  document.querySelectorAll('[data-icon]').forEach((n) => { n.innerHTML = ICON[n.dataset.icon]; });
  el.btnSound.innerHTML = Sound.on ? ICON.soundOn : ICON.soundOff;
  buildMenu();
  newGame();
  openMenu();

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(100, Math.max(0, now - last));
    last = now;
    update(dt, now);
    render(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
