<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0520">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arcadia">
<meta name="description" content="Arcadia – Browserspiele zum Sofort-Losspielen.">
<title>Arcadia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0520'/%3E%3Cpath d='M18 48 32 14 46 48M23 37h18' fill='none' stroke='%23ff3ea5' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --pink: #ff3ea5; --cyan: #29f0ff; --violet: #8b5cff; --ink: #0d0520; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: 'Fredoka', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff;
    background: var(--ink); overflow-x: hidden;
  }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block;
    background: linear-gradient(#0d0520 0%, #1d0b44 55%, #3a0f5c 100%); }
  .wrap { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 40px 18px 34vh; }
  header { text-align: center; margin: 10px 0 34px; }
  h1 {
    margin: 0; font-family: 'Monoton', 'Fredoka', sans-serif; font-weight: 400; letter-spacing: 6px;
    font-size: clamp(46px, 12vw, 104px); line-height: 1.05; color: #ffe4f3;
    text-shadow: 0 0 6px #fff, 0 0 18px var(--pink), 0 0 42px var(--pink), 0 0 80px var(--violet);
    animation: flicker 6s infinite;
  }
  .tag { margin: 12px 0 0; font-size: 15px; letter-spacing: 6px; text-transform: uppercase; color: var(--cyan);
    text-shadow: 0 0 10px var(--cyan); }
  .insert { display: inline-block; margin-top: 18px; padding: 6px 14px; border: 2px solid var(--cyan); border-radius: 8px;
    font-size: 13px; letter-spacing: 4px; color: var(--cyan); text-shadow: 0 0 8px var(--cyan); box-shadow: 0 0 14px rgba(41,240,255,.35);
    animation: blink 1.2s steps(1) infinite; }

  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; }
  .game {
    position: relative; display: flex; flex-direction: column; border-radius: 20px; overflow: hidden; text-decoration: none; color: #fff;
    background: rgba(20, 8, 48, .78); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border: 2px solid rgba(139,92,255,.55); box-shadow: 0 0 22px rgba(139,92,255,.25), inset 0 0 22px rgba(139,92,255,.12);
    transition: transform .18s, box-shadow .18s, border-color .18s; transform-style: preserve-3d;
  }
  .games { perspective: 900px; }
  a.game:hover, a.game:focus-visible { border-color: var(--cyan); outline: none;
    box-shadow: 0 0 30px rgba(41,240,255,.45), 0 0 60px rgba(255,62,165,.25), inset 0 0 22px rgba(41,240,255,.15); }
  .screen { position: relative; height: 170px; background: #0a0418; border-bottom: 2px solid rgba(139,92,255,.4); }
  .screen canvas { width: 100%; height: 100%; display: block; }
  .screen::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(rgba(0,0,0,.18) 0 2px, transparent 2px 4px); }
  .info { padding: 16px 18px 20px; }
  .info h2 { margin: 0 0 6px; font-size: 26px; letter-spacing: 1px; }
  .info p { margin: 0 0 16px; color: #c9bdf2; font-size: 15px; line-height: 1.5; }
  .play {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 12px; font-weight: 700; letter-spacing: 2px;
    background: linear-gradient(90deg, var(--pink), var(--violet)); box-shadow: 0 0 18px rgba(255,62,165,.55);
  }
  .play::before { content: ''; border-left: 10px solid #fff; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
  .soon { opacity: .8; }
  .soon .screen { display: grid; place-items: center; }
  .soon .q { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 76px; color: var(--violet); text-shadow: 0 0 20px var(--violet); animation: blink 2.4s ease-in-out infinite; }
  .soon .play { background: rgba(139,92,255,.25); box-shadow: none; color: #c9bdf2; }
  .soon .play::before { display: none; }
  footer { position: relative; z-index: 1; text-align: center; margin-top: 40px; font-size: 13px; letter-spacing: 3px; color: #a99ad8; }

  @keyframes blink { 50% { opacity: .35; } }
  @keyframes flicker { 0%, 92%, 100% { opacity: 1; } 93% { opacity: .55; } 94% { opacity: 1; } 96% { opacity: .7; } }
  @media (max-width: 520px) { .wrap { padding-top: 28px; } h1 { letter-spacing: 3px; } .tag { letter-spacing: 3px; font-size: 13px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; } }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<div class="wrap">
  <header>
    <h1>Arcadia</h1>
    <p class="tag">Deine Spielhalle im Browser</p>
    <span class="insert">Press Start</span>
  </header>

  <main class="games">
    <a class="game" href="/snake/">
      <div class="screen"><canvas id="snake-demo" aria-hidden="true"></canvas></div>
      <div class="info">
        <h2>Snake</h2>
        <p>Der Klassiker mit 16 Spielmodi, Parkour-Training und 6 Welten.</p>
        <span class="play">SPIELEN</span>
      </div>
    </a>
    <div class="game soon">
      <div class="screen"><span class="q">?</span></div>
      <div class="info">
        <h2>Bald mehr</h2>
        <p>Das nächste Spiel ist schon in Planung.</p>
        <span class="play">DEMNÄCHST</span>
      </div>
    </div>
  </main>
  <footer>ARCADIA · INSERT COIN</footer>
</div>

<script>
(() => {
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Kleine Neon-Schlange, die in der Snake-Karte Äpfel jagt
  const dc = document.getElementById('snake-demo'), dx = dc.getContext('2d');
  const COLS = 16, ROWS = 8;
  let snake, dir, apple, cell = 10, last = 0;
  function resetSnake() {
    snake = [{ x: 4, y: 4 }, { x: 3, y: 4 }, { x: 2, y: 4 }];
    dir = { x: 1, y: 0 };
    placeApple();
  }
  function placeApple() {
    do { apple = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) }; }
    while (snake.some((p) => p.x === apple.x && p.y === apple.y));
  }
  function free(x, y) { return x >= 0 && y >= 0 && x < COLS && y < ROWS && !snake.slice(0, -1).some((p) => p.x === x && p.y === y); }
  function stepSnake() {
    const h = snake[0];
    const opts = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }]
      .filter((d) => !(d.x === -dir.x && d.y === -dir.y) && free(h.x + d.x, h.y + d.y))
      .sort((a, b) => (Math.abs(h.x + a.x - apple.x) + Math.abs(h.y + a.y - apple.y)) - (Math.abs(h.x + b.x - apple.x) + Math.abs(h.y + b.y - apple.y)));
    if (!opts.length) return resetSnake();
    dir = opts[0];
    const n = { x: h.x + dir.x, y: h.y + dir.y };
    snake.unshift(n);
    if (n.x === apple.x && n.y === apple.y) { placeApple(); if (snake.length > 18) snake.length = 6; } else snake.pop();
  }
  function sizeDemo() {
    const d = Math.min(devicePixelRatio || 1, 2), w = dc.clientWidth, h = dc.clientHeight;
    dc.width = w * d; dc.height = h * d; dx.setTransform(d, 0, 0, d, 0, 0);
    cell = Math.min(w / COLS, h / ROWS);
  }
  function drawDemo(t) {
    const w = dc.clientWidth, h = dc.clientHeight, ox = (w - cell * COLS) / 2, oy = (h - cell * ROWS) / 2;
    dx.clearRect(0, 0, w, h);
    dx.strokeStyle = 'rgba(139,92,255,.18)'; dx.lineWidth = 1;
    for (let i = 0; i <= COLS; i++) { dx.beginPath(); dx.moveTo(ox + i * cell, oy); dx.lineTo(ox + i * cell, oy + ROWS * cell); dx.stroke(); }
    for (let j = 0; j <= ROWS; j++) { dx.beginPath(); dx.moveTo(ox, oy + j * cell); dx.lineTo(ox + COLS * cell, oy + j * cell); dx.stroke(); }
    const c = (p) => [ox + (p.x + 0.5) * cell, oy + (p.y + 0.5) * cell];
    const [ax, ay] = c(apple), pulse = 0.8 + 0.2 * Math.sin(t / 200);
    dx.shadowBlur = 16; dx.shadowColor = '#ff3ea5'; dx.fillStyle = '#ff3ea5';
    dx.beginPath(); dx.arc(ax, ay, cell * 0.3 * pulse, 0, Math.PI * 2); dx.fill();
    dx.shadowColor = '#29f0ff'; dx.strokeStyle = '#29f0ff'; dx.lineWidth = cell * 0.55; dx.lineCap = 'round'; dx.lineJoin = 'round';
    dx.beginPath(); snake.forEach((p, i) => { const [x, y] = c(p); i ? dx.lineTo(x, y) : dx.moveTo(x, y); }); dx.stroke();
    dx.shadowBlur = 0;
    const [hx, hy] = c(snake[0]);
    dx.fillStyle = '#0a0418';
    for (const s of [-1, 1]) { dx.beginPath(); dx.arc(hx + dir.x * cell * 0.1 - dir.y * s * cell * 0.13, hy + dir.y * cell * 0.1 + dir.x * s * cell * 0.13, cell * 0.07, 0, Math.PI * 2); dx.fill(); }
  }

  function frame(t) {
    if (t - last > 140) { last = t; stepSnake(); }
    drawDemo(t);
    if (!still) requestAnimationFrame(frame);
  }
  addEventListener('resize', () => { sizeDemo(); if (still) frame(0); });
  sizeDemo(); resetSnake();

  // Karten kippen in 3D Richtung Maus
  document.querySelectorAll('a.game').forEach((card) => {
    card.addEventListener('pointermove', (e) => {
      const r = card.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
      card.style.transform = `translateY(-6px) rotateX(${(-y * 12).toFixed(2)}deg) rotateY(${(x * 14).toFixed(2)}deg)`;
    });
    card.addEventListener('pointerleave', () => { card.style.transform = ''; });
  });
  requestAnimationFrame(frame);
})();
</script>
<script src="vendor/three.min.js"></script>
<script src="scene.js"></script>
</body>
</html>
