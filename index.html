<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a752c">
<meta name="description" content="Snake ist gerade in Wartungsarbeiten und bald wieder da.">
<title>Snake – Wartungsarbeiten</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23aad751'/%3E%3Cpath d='M12 46C12 30 30 36 32 24S50 12 52 20' fill='none' stroke='%234e7cf6' stroke-width='10' stroke-linecap='round'/%3E%3Ccircle cx='52' cy='20' r='3' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center; padding: 16px; min-height: 100vh; min-height: 100dvh;
    background: #3f6a24 radial-gradient(120% 90% at 50% 0%, #6fa344 0%, #3f6a24 55%, #294a15 100%) fixed;
    font-family: 'Fredoka', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #203018;
  }
  .card {
    width: min(460px, 100%); padding: 30px 26px 28px; border-radius: 26px; text-align: center;
    background: #fff; box-shadow: 0 30px 70px rgba(0,0,0,.35);
  }
  .snake { width: 150px; height: 75px; animation: wiggle 2.4s ease-in-out infinite; }
  h1 { margin: 10px 0 8px; font-size: 32px; font-weight: 700; color: #4a752c; }
  p { margin: 0; font-size: 17px; line-height: 1.5; color: #4f5f42; }
  .bar { height: 12px; margin-top: 24px; border-radius: 99px; background: #eef4e6; overflow: hidden; }
  .bar i {
    display: block; width: 40%; height: 100%; border-radius: 99px;
    background: repeating-linear-gradient(45deg, #ffca28 0 12px, #ffb300 12px 24px);
    animation: slide 1.6s ease-in-out infinite alternate;
  }
  @keyframes wiggle { 50% { transform: translateY(-4px) rotate(-2deg); } }
  @keyframes slide { from { transform: translateX(-10%); } to { transform: translateX(160%); } }
  @media (prefers-reduced-motion: reduce) { .snake, .bar i { animation: none; } }
</style>
</head>
<body>
  <main class="card">
    <svg class="snake" viewBox="0 0 120 60" aria-hidden="true">
      <path d="M10 42c14 0 14-22 30-22s16 22 32 22 14-18 26-20" fill="none" stroke="#4e7cf6" stroke-width="13" stroke-linecap="round"/>
      <circle cx="100" cy="22" r="9.5" fill="#4e7cf6"/>
      <circle cx="102" cy="17.5" r="3.6" fill="#fff"/><circle cx="103" cy="17.5" r="1.8" fill="#1b1b1b"/>
      <circle cx="102" cy="26.5" r="3.6" fill="#fff"/><circle cx="103" cy="26.5" r="1.8" fill="#1b1b1b"/>
    </svg>
    <h1>🛠️ Wartungsarbeiten</h1>
    <p>Der Server ist gerade in Wartungsarbeiten.<br>Snake wird ein bisschen umgebaut – bald geht es weiter!</p>
    <div class="bar" aria-hidden="true"><i></i></div>
  </main>
</body>
</html>
