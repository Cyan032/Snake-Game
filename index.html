<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241757">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arcadia">
<meta name="description" content="Arcadia – Browserspiele zum Sofort-Losspielen.">
<title>Arcadia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23241757'/%3E%3Crect x='12' y='40' width='40' height='14' rx='6' fill='%236c4cf5'/%3E%3Crect x='29' y='20' width='6' height='22' rx='3' fill='%23cfc6ff'/%3E%3Ccircle cx='32' cy='17' r='9' fill='%23ff4fa3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: 'Fredoka', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #241a3d;
    background: #1c1442 radial-gradient(120% 80% at 50% 0%, #4b2fa8 0%, #241757 50%, #120c2c 100%) fixed;
    padding: 28px 16px 40px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  header { text-align: center; color: #fff; margin: 10px 0 30px; }
  .logo { width: 150px; height: 110px; filter: drop-shadow(0 8px 14px rgba(0,0,0,.3)); animation: stomp 3s ease-in-out infinite; }
  h1 { margin: 6px 0 4px; font-size: clamp(42px, 9vw, 68px); font-weight: 700; letter-spacing: 2px; text-shadow: 0 0 18px rgba(255,79,163,.6), 0 4px 0 #3b2a7a; }
  header p { margin: 0; font-size: 18px; opacity: .85; }
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
  .game {
    display: flex; flex-direction: column; border-radius: 22px; overflow: hidden; background: #fff; color: inherit;
    text-decoration: none; box-shadow: 0 16px 36px rgba(0,0,0,.3); transition: transform .15s, box-shadow .15s;
  }
  a.game:hover { transform: translateY(-4px); box-shadow: 0 22px 44px rgba(0,0,0,.35); }
  .thumb { height: 150px; display: grid; place-items: center; }
  .thumb svg { width: 80%; height: 80%; }
  .info { padding: 14px 18px 18px; }
  .info h2 { margin: 0 0 4px; font-size: 24px; }
  .info p { margin: 0 0 12px; color: #5d5278; font-size: 15px; line-height: 1.45; }
  .btn { display: inline-block; padding: 9px 18px; border-radius: 12px; background: #3f6ff0; color: #fff; font-weight: 600; box-shadow: 0 4px 0 #2b51c4; }
  .game.soon { opacity: .7; }
  .soon .thumb { background: repeating-linear-gradient(45deg, #ece8fb 0 14px, #e1dbf7 14px 28px); color: #8f84b5; font-size: 44px; font-weight: 700; }
  .soon .btn { background: #ddd6f5; color: #5d5278; box-shadow: 0 4px 0 #c3b9ea; }
  footer { text-align: center; color: #cfc6ff; opacity: .7; margin-top: 34px; font-size: 14px; }
  @keyframes stomp { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px) rotate(-1deg); } }
  @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 120 110" aria-hidden="true">
      <rect x="18" y="70" width="84" height="30" rx="12" fill="#3b2a7a"/>
      <rect x="18" y="64" width="84" height="26" rx="12" fill="#6c4cf5"/>
      <rect x="56" y="30" width="8" height="40" rx="4" fill="#cfc6ff"/>
      <circle cx="60" cy="26" r="17" fill="#ff4fa3"/>
      <circle cx="54" cy="20" r="5" fill="#ffffff" opacity=".7"/>
      <circle cx="34" cy="77" r="6" fill="#ffd23f"/>
      <circle cx="86" cy="77" r="6" fill="#3fe0d0"/>
    </svg>
    <h1>Arcadia</h1>
    <p>Such dir ein Spiel aus und leg los!</p>
  </header>
  <main class="games">
    <a class="game" href="/snake/">
      <div class="thumb" style="background:#aad751">
        <svg viewBox="0 0 120 60" aria-hidden="true">
          <path d="M10 42c14 0 14-22 30-22s16 22 32 22 14-18 26-20" fill="none" stroke="#4e7cf6" stroke-width="13" stroke-linecap="round"/>
          <circle cx="100" cy="22" r="9.5" fill="#4e7cf6"/>
          <circle cx="102" cy="17.5" r="3.6" fill="#fff"/><circle cx="103" cy="17.5" r="1.8" fill="#1b1b1b"/>
          <circle cx="102" cy="26.5" r="3.6" fill="#fff"/><circle cx="103" cy="26.5" r="1.8" fill="#1b1b1b"/>
          <circle cx="112" cy="46" r="5" fill="#e7471d"/>
        </svg>
      </div>
      <div class="info">
        <h2>Snake</h2>
        <p>Der Klassiker mit 16 Spielmodi, Parkour-Training und 6 Welten.</p>
        <span class="btn">Spielen</span>
      </div>
    </a>
    <div class="game soon">
      <div class="thumb">?</div>
      <div class="info">
        <h2>Bald mehr</h2>
        <p>Das nächste Spiel ist schon in Planung.</p>
        <span class="btn">Demnächst</span>
      </div>
    </div>
  </main>
  <footer>Arcadia</footer>
</div>
</body>
</html>
