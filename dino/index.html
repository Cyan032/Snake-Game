<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#4a752c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dino Runner – Arcadia</title>
<script src="/arcadia.js?v=11"></script>
<link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --hud: #4a752c; --frame: #578a34; --ink: #203018; --muted: #6b7d5c; --soft: #f1f7e8; --soft-2: #e3efd3;
    --blue: #3f6ff0; --blue-dark: #2b51c4; --p1: #6fa344; --p2: #3f6a24; --p3: #294a15; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Fredoka', system-ui, sans-serif; color: #fff; overflow: hidden; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    background: radial-gradient(120% 90% at 50% 0%, var(--p1) 0%, var(--p2) 55%, var(--p3) 100%) fixed var(--p2);
    display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; }
  button { font-family: inherit; touch-action: manipulation; }
  .hidden { display: none !important; }
  #app { display: flex; flex-direction: column; }
  #hud { display: flex; align-items: center; gap: 14px; min-height: 54px; background: var(--hud); padding: 6px 10px 6px 14px;
    border-radius: 16px 16px 0 0; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .stat { display: flex; align-items: center; gap: 7px; font-size: 22px; font-weight: 600; }
  .stat svg { width: 26px; height: 26px; }
  .grow { flex: 1; }
  .icon-btn { width: 40px; height: 40px; border: 0; border-radius: 12px; cursor: pointer; background: rgba(255,255,255,.12);
    color: #fff; font-size: 20px; display: grid; place-items: center; }
  .icon-btn:hover { background: rgba(255,255,255,.22); }
  body.retro #hud { background: transparent !important; box-shadow: none; position: absolute; left: 0; right: 0; z-index: 2; }
  body.retro #hud .stat { visibility: hidden; }
  body.retro .icon-btn { background: transparent; color: #8a8a8a; }
  body.retro #frame { background: transparent !important; box-shadow: none; padding: 0; }
  body.retro #app { position: relative; }
  body.retro #board { border-radius: 0; transition: filter .9s; }
  body.retro.night { background: #202020 !important; }
  body { transition: background-color .9s; }
  #frame { position: relative; background: var(--frame); padding: 10px; border-radius: 0 0 16px 16px; box-shadow: 0 18px 40px rgba(0,0,0,.3); }
  #board { display: block; border-radius: 6px; touch-action: none; }
  #hint { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); padding: 12px 18px; border-radius: 16px;
    background: rgba(16,26,10,.8); text-align: center; font-size: 16px; pointer-events: none; white-space: nowrap; }
  #hint b { display: block; font-size: 19px; }

  #menu { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(20,35,10,.45); z-index: 5; padding: 14px; }
  .card { position: relative; width: min(440px, 100%); max-height: calc(100dvh - 28px); overflow: auto; background: #fff; color: var(--ink);
    border-radius: 22px; padding: 22px 20px 20px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .home { position: absolute; top: 14px; left: 16px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; }
  h1 { margin: 10px 0 2px; text-align: center; font-size: 34px; color: var(--hud); }
  .result { text-align: center; color: var(--muted); font-size: 17px; margin: 0 0 12px; min-height: 22px; }
  .result b { color: var(--ink); }
  .row { margin: 10px 0; }
  .row label { display: block; font-size: 14px; font-weight: 600; color: var(--muted); margin: 0 0 5px 4px; }
  .seg { display: flex; gap: 2px; padding: 3px; border-radius: 13px; background: var(--soft); }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 10px; font-size: 15px; font-weight: 600;
    color: var(--muted); cursor: pointer; white-space: nowrap; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .seg.colors button { height: 34px; padding: 0; }
  .seg.colors button i { display: inline-block; width: 20px; height: 20px; border-radius: 50%; vertical-align: middle; }
  .seg.colors button.on i { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--ink); }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; border: 0; border-radius: 14px; padding: 13px 20px; font-size: 18px; font-weight: 600; cursor: pointer; background: var(--soft-2); color: var(--ink); }
  .btn.primary { background: var(--blue); color: #fff; box-shadow: 0 4px 0 var(--blue-dark); }
  .btn.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--blue-dark); }
  .modeinfo { margin: 6px 4px 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
  .seg button:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat" title="Meter"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z" fill="#ffd54f"/></svg><span id="score">0</span></div>
    <div class="stat" title="Rekord"><svg viewBox="0 0 24 24"><path d="M6 3h12v3a6 6 0 0 1-5 5.9V15h3v3H8v-3h3v-3.1A6 6 0 0 1 6 6z" fill="#ffca28"/><path d="M6 5H3a3 3 0 0 0 3 4M18 5h3a3 3 0 0 1-3 4" fill="none" stroke="#ffca28" stroke-width="2"/></svg><span id="best">0</span></div>
    <div class="grow"></div>
    <button class="icon-btn" id="sound" type="button" title="Ton (M)">♪</button>
    <button class="icon-btn" id="open-menu" type="button" title="Menü (Esc)">☰</button>
  </div>
  <div id="frame">
    <canvas id="board"></canvas>
    <div id="hint"><b>Tippen oder Leertaste: springen</b>Pfeil runter oder unten tippen: ducken</div>
  </div>
</div>

<div id="menu">
  <div class="card">
    <a class="home" href="/">‹ Arcadia</a>
    <h1>Dino Runner</h1>
    <p class="result" id="result"></p>
    <div class="row"><label>Modus</label><div class="seg" data-s="mode"></div><p class="modeinfo" id="modeinfo"></p></div>
    <div class="row"><label>Tempo</label><div class="seg" data-s="speed"></div></div>
    <div class="row"><label>Wird schneller</label><div class="seg" data-s="ramp"></div></div>
    <div class="row"><label>Hindernisse</label><div class="seg" data-s="density"></div></div>
    <div class="row"><label>Sprungkraft</label><div class="seg" data-s="jump"></div></div>
    <div class="row"><label>Bienen (ducken!)</label><div class="seg" data-s="bees"></div></div>
    <div class="row"><label>Design</label><div class="seg" data-s="style"></div></div>
    <div class="row"><label>Welt</label><div class="seg" data-s="world"></div></div>
    <div class="row"><label>Farbe</label><div class="seg colors" data-s="color"></div></div>
    <div class="actions">
      <button class="btn" id="reset" type="button">Zurücksetzen</button>
      <button class="btn primary" id="start" type="button">Spielen</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const cv = $('board'), main = cv.getContext('2d');
  let ctx = main;
  // Retro: Szene wird klein gezeichnet und grob hochskaliert (Pixel-Look)
  const PX = 20, offCv = document.createElement('canvas'), offCtx = offCv.getContext('2d');
  let night = false;

  // ---------- Einstellungen ----------
  const OPTS = {
    mode: { label: ['Rekord-Modus', 'Frei spielen'], val: [1, 0], def: 0 },
    speed:   { label: ['Langsam', 'Normal', 'Schnell', 'Turbo'], val: [6, 8, 10.5, 13], def: 1 },
    ramp:    { label: ['Aus', 'Normal', 'Stark'], val: [0, 0.08, 0.16], def: 1 },
    density: { label: ['Wenig', 'Normal', 'Viel'], val: [1.35, 1, 0.75], def: 1 },
    jump:    { label: ['Niedrig', 'Normal', 'Hoch'], val: [0.88, 1, 1.12], def: 1 },
    bees:    { label: ['Aus', 'An'], val: [0, 1], def: 1 },
    style:   { label: ['Bunt', 'Retro (schwarz-weiß)'], val: [0, 1], def: 0 },
    world:   { label: ['Wiese', 'Wüste', 'Schnee', 'Nacht'], val: ['meadow', 'desert', 'snow', 'night'], def: 0 },
    color:   { label: ['', '', '', '', '', ''], val: ['#43a047', '#4e7cf6', '#ef4f8b', '#f58a1f', '#9a5cf0', '#14b8a6'], def: 0 },
  };
  const WORLDS = {
    meadow: { grass: ['#aad751', '#a2d149'], frame: '#578a34', hud: '#4a752c', page: ['#6fa344', '#3f6a24', '#294a15'], rock: '#8d8f86', rockTop: '#b4b6ac', bush: '#3d7a22', bushTop: '#5a9c35', ground: '#8b5a2b', groundTop: '#6c9e40' },
    desert: { grass: ['#f2d58e', '#eacb7e'], frame: '#c99a4b', hud: '#a87a33', page: ['#efcd84', '#c29445', '#8c6526'], rock: '#b07a43', rockTop: '#d39d61', bush: '#4f8a3a', bushTop: '#6fae52', ground: '#a87a33', groundTop: '#ebbb6c' },
    snow:   { grass: ['#f3f8fc', '#e5eff6'], frame: '#8fb6d1', hud: '#5d8db0', page: ['#d7ebf7', '#86afcd', '#557f9f'], rock: '#7f9db3', rockTop: '#d2edfa', bush: '#2f6b4a', bushTop: '#e9f5fb', ground: '#5d8db0', groundTop: '#d2edfa' },
    night:  { grass: ['#2f4b2b', '#2a4427'], frame: '#1d321a', hud: '#152613', page: ['#2a462c', '#132414', '#070f08'], rock: '#4d554a', rockTop: '#6a7466', bush: '#1f3a1a', bushTop: '#30562a', ground: '#152613', groundTop: '#30562a' },
  };
  const RETRO = { grass: ['#fff', '#fff'], frame: '#d8d8d8', hud: '#535353', page: ['#fafafa', '#ececec', '#d6d6d6'],
    rock: '#535353', rockTop: '#535353', bush: '#535353', bushTop: '#535353', ground: '#fff', groundTop: '#535353' };
  const retro = () => v('style') === 1;
  const W = () => retro() ? RETRO : WORLDS[v('world')];
  const set = {};
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('dino.settings') || '{}'); } catch (e) {}
  for (const k in OPTS) set[k] = Number.isInteger(saved[k]) && saved[k] < OPTS[k].val.length ? saved[k] : OPTS[k].def;
  // Rekord-Modus: feste Standard-Einstellungen, nur dann zählen Rekorde
  const REC = { speed: 1, ramp: 1, density: 1, jump: 1, bees: 1 };
  const rec = () => set.mode === 0;
  const idx = (k) => (rec() && k in REC ? REC[k] : set[k]);
  const v = (k) => OPTS[k].val[idx(k)];
  const save = () => { try { localStorage.setItem('dino.settings', JSON.stringify(set)); } catch (e) {} };
  const bestKey = () => 'dino.rec';
  const getBest = () => { if (!rec()) return 0; try { return +localStorage.getItem(bestKey()) || 0; } catch (e) { return 0; } };

  function buildMenu() {
    const mi = document.getElementById('modeinfo');
    if (mi) mi.textContent = rec() ? 'Feste Einstellungen, nur hier zählen Rekorde: Tempo Normal · wird schneller · Hindernisse Normal · mit Bienen.' : 'Eigene Einstellungen, hier werden keine Rekorde gespeichert.';
    document.querySelectorAll('.seg[data-s]').forEach((seg) => {
      const k = seg.dataset.s; seg.innerHTML = '';
      OPTS[k].label.forEach((l, i) => {
        const b = document.createElement('button'); b.type = 'button';
        if (k === 'color') { b.innerHTML = `<i style="background:${OPTS.color.val[i]}"></i>`; b.title = 'Farbe ' + (i + 1); }
        else b.textContent = l;
        b.className = i === idx(k) ? 'on' : '';
        if (rec() && k in REC) b.disabled = true;
        b.onclick = () => { set[k] = i; save(); buildMenu(); applyWorld(); newRound(); draw(); };
        seg.appendChild(b);
      });
    });
  }

  // ---------- Spielfeld (in Kästchen) ----------
  const COLS = 22, ROWS = 11, GROUND = ROWS - 2;
  let cell = 30, dpr = 1;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    const maxW = innerWidth - 24, maxH = innerHeight - 54 - 36;
    cell = Math.max(12, Math.floor(Math.min(maxW / COLS, maxH / ROWS)));
    cv.width = COLS * cell * dpr; cv.height = ROWS * cell * dpr;
    cv.style.width = COLS * cell + 'px'; cv.style.height = ROWS * cell + 'px';
    draw();
  }
  function applyWorld() {
    document.body.classList.toggle('retro', retro());
    if (!retro()) setNight(false);
    const w = W();
    $('hud').style.background = w.hud; $('frame').style.background = w.frame;
    document.body.style.background = `radial-gradient(120% 90% at 50% 0%, ${w.page[0]} 0%, ${w.page[1]} 55%, ${w.page[2]} 100%) fixed ${w.page[1]}`;
    document.querySelector('meta[name=theme-color]').content = w.hud;
  }

  // ---------- Spielzustand ----------
  const GRAV = 70, DX = 3.2;
  let state = 'ready', dino, obs, dist, score, best, speed, nextGap, t = 0, deadT = 0, shake = 0, parts = [], scroll = 0;
  let jumpHeld = false, duckHeld = false;
  function setNight(on) {
    night = on; cv.style.filter = on ? 'invert(1)' : '';
    document.body.classList.toggle('night', on);
  }
  function newRound() {
    setNight(false);
    dino = { y: GROUND, vy: 0, duck: false, ground: true };
    obs = []; dist = 0; score = 0; parts = []; best = getBest(); speed = v('speed'); nextGap = 9;
    $('score').textContent = 0; $('best').textContent = best;
    state = 'ready'; $('hint').classList.remove('hidden');
  }
  function spawn() {
    const r = Math.random(), x = COLS + 1;
    if (v('bees') && dist > 40 && r < 0.22) {
      obs.push({ type: 'bee', x, w: 0.9, y: GROUND - (Math.random() < 0.5 ? 1.45 : 2.6), h: 0.7 });
    } else if (r < 0.55) {
      const n = Math.random() < 0.35 && dist > 25 ? 2 : 1;
      obs.push({ type: 'rock', x, w: 0.95 * n, h: 0.85, y: GROUND - 0.85, n });
    } else {
      const tall = Math.random() < 0.5;
      obs.push({ type: 'bush', x, w: 1, h: tall ? 1.7 : 1.2, y: GROUND - (tall ? 1.7 : 1.2) });
    }
    const minGap = 4.5 + speed * 0.35;
    nextGap = (minGap + Math.random() * 6) * v('density');
  }

  // ---------- Ton ----------
  let ac, sound = true;
  try { sound = localStorage.getItem('dino.sound') !== '0'; } catch (e) {}
  const updSound = () => { $('sound').style.opacity = sound ? 1 : 0.45; };
  function beep(f, d = 0.08, type = 'triangle', vol = 0.06, up = 1.4) {
    if (!sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, ac.currentTime); o.frequency.exponentialRampToValueAtTime(f * up, ac.currentTime + d);
      g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }

  // ---------- Steuerung ----------
  const menuOpen = () => !$('menu').classList.contains('hidden');
  function openMenu() {
    if (state === 'play') state = 'pause';
    $('result').innerHTML = state === 'over' ? `Meter: <b>${score}</b> · Rekord: <b>${best}</b>` : (state === 'pause' ? 'Pause' : 'Spring über Steine und Büsche, duck dich unter Bienen!');
    $('start').textContent = state === 'pause' ? 'Weiter' : (state === 'over' ? 'Nochmal' : 'Spielen');
    $('menu').classList.remove('hidden');
  }
  function closeMenu() {
    $('menu').classList.add('hidden');
    if (state === 'over') newRound();
    if (state === 'pause') state = 'play';
  }
  function begin() {
    if (state === 'ready') { state = 'play'; $('hint').classList.add('hidden'); }
    if (state === 'pause') state = 'play';
  }
  function jump() {
    if (menuOpen()) return;
    if (state === 'over') { if (deadT > 0.45) newRound(); return; }
    begin();
    jumpHeld = true;
    if (dino.ground) {
      dino.vy = -19 * v('jump'); dino.ground = false; beep(420, 0.12, 'square', 0.04, 1.8);
      for (let i = 0; i < 5; i++) parts.push({ x: DX, y: GROUND, vx: -2 - Math.random() * 3, vy: -Math.random() * 3, life: 0.35 });
    }
  }
  function duck(on) {
    if (menuOpen()) return;
    duckHeld = on;
    if (on) { if (state === 'over') return; begin(); if (!dino.ground) dino.vy = Math.max(dino.vy, 18); }
  }
  // Touch: obere zwei Drittel springen, unteres Drittel ducken
  $('board').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    if (e.clientY - r.top > r.height * 0.7 && state !== 'over') duck(true); else jump();
  });
  addEventListener('pointerup', () => { jumpHeld = false; duck(false); });
  addEventListener('pointercancel', () => { jumpHeld = false; duck(false); });
  $('hint').addEventListener('pointerdown', jump);
  $('start').onclick = closeMenu;
  $('open-menu').onclick = openMenu;
  $('reset').onclick = () => { for (const k in OPTS) set[k] = OPTS[k].def; save(); buildMenu(); applyWorld(); newRound(); };
  $('sound').onclick = () => { sound = !sound; try { localStorage.setItem('dino.sound', sound ? '1' : '0'); } catch (e) {} updSound(); };
  const isJump = (k, e) => k === 'Space' || k === ' ' || k === 'ArrowUp' || k === 'KeyW' || k === 'w' || e.keyCode === 32 || e.keyCode === 38;
  const isDuck = (k, e) => k === 'ArrowDown' || k === 'KeyS' || k === 's' || e.keyCode === 40;
  addEventListener('keydown', (e) => {
    const k = e.code || e.key;
    if (k === 'Escape' || k === 'KeyP' || k === 'p') { e.preventDefault(); menuOpen() ? closeMenu() : openMenu(); return; }
    if (k === 'KeyM' || k === 'm') { $('sound').click(); return; }
    if (menuOpen()) { if (k === 'Enter' || k === 'Space' || k === ' ') { e.preventDefault(); closeMenu(); } return; }
    if (isJump(k, e)) { e.preventDefault(); if (!e.repeat) jump(); }
    else if (isDuck(k, e)) { e.preventDefault(); if (!e.repeat) duck(true); }
    else if (k === 'Enter') { e.preventDefault(); jump(); }
  }, true);
  addEventListener('keyup', (e) => {
    const k = e.code || e.key;
    if (isJump(k, e)) jumpHeld = false;
    if (isDuck(k, e)) duck(false);
  }, true);
  addEventListener('blur', () => { jumpHeld = false; duckHeld = false; if (state === 'play') openMenu(); });

  function die() {
    window.Arcadia && Arcadia.xp(Math.min(120, 5 + Math.floor(score / 15)), 'Dino Runner');
    state = 'over'; deadT = 0; shake = 0.35; beep(200, 0.35, 'sawtooth', 0.07, 0.4);
    if (score > best) { best = score; try { if (rec()) localStorage.setItem(bestKey(), best); } catch (e) {} $('best').textContent = best; }
    setTimeout(() => { if (state === 'over' && !menuOpen()) openMenu(); }, 800);
  }

  // Trefferzone des Dinos (etwas kleiner als die Zeichnung, damit es fair ist)
  function dinoBox() {
    return dino.duck && dino.ground ? { x: DX - 0.75, y: dino.y - 0.85, w: 1.6, h: 0.8 } : { x: DX - 0.5, y: dino.y - 1.55, w: 1.0, h: 1.5 };
  }

  function update(dt) {
    t += dt; shake = Math.max(0, shake - dt);
    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 10 * dt; p.life -= dt; }
    parts = parts.filter((p) => p.life > 0);
    if (state === 'ready' || state === 'pause') return;
    if (state === 'over') { deadT += dt; return; }

    speed = Math.min(v('speed') + dist * v('ramp') * 0.1, v('speed') * 2.4);
    const dx = speed * dt;
    dist += dx; scroll += dx;
    const s = Math.floor(dist / 2);
    if (s !== score) {
      score = s; $('score').textContent = score;
      if (retro()) { const n = score >= 500 && Math.floor(score / 500) % 2 === 1; if (n !== night) setNight(n); }
      if (score > 0 && score % 100 === 0) beep(700, 0.25, 'square', 0.04, 1.5);
    }

    // Sprung: lange halten = höher springen
    const g = GRAV * (dino.vy < 0 && jumpHeld ? 0.55 : 1);
    if (!dino.ground) {
      dino.vy += g * dt; dino.y += dino.vy * dt;
      if (dino.y >= GROUND) { dino.y = GROUND; dino.vy = 0; dino.ground = true; }
    }
    dino.duck = duckHeld;

    nextGap -= dx;
    if (nextGap <= 0) spawn();
    const b = dinoBox();
    for (const o of obs) {
      o.x -= dx * (o.type === 'bee' ? 1.12 : 1);
      const ox = o.x + 0.12, ow = o.w - 0.24, oy = o.y + 0.1, oh = o.h - 0.15;
      if (b.x < ox + ow && b.x + b.w > ox && b.y < oy + oh && b.y + b.h > oy) return die();
    }
    obs = obs.filter((o) => o.x > -3);
  }

  // ---------- Zeichnen ----------
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
  function shade(hex, k) { const n = parseInt(hex.slice(1), 16); return `rgb(${(n >> 16) * k},${(n >> 8 & 255) * k},${(n & 255) * k})`; }
  function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }

  function drawDino(c) {
    const col = retro() ? '#535353' : v('color'), dk = retro() ? '#535353' : shade(col, 0.72), x = DX * c, y = dino.y * c;
    const run = state === 'play' && dino.ground ? Math.sin(t * 22) : 0;
    ctx.save(); ctx.translate(x, y);
    // Schatten
    ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(0, (GROUND - dino.y) * c, c * 0.6, c * 0.1, 0, 0, 7); ctx.fill();
    if (dino.duck && dino.ground) {
      // geduckt: flach und lang
      ctx.fillStyle = dk;
      rr(-c * 0.35 + run * c * 0.08, -c * 0.25, c * 0.2, c * 0.25, c * 0.08); ctx.fill();
      rr(c * 0.1 - run * c * 0.08, -c * 0.25, c * 0.2, c * 0.25, c * 0.08); ctx.fill();
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(-c * 0.55, -c * 0.5); ctx.quadraticCurveTo(-c * 1.1, -c * 0.4, -c * 1.05, -c * 0.3); ctx.quadraticCurveTo(-c * 0.7, -c * 0.25, -c * 0.4, -c * 0.25); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-c * 0.05, -c * 0.45, c * 0.6, c * 0.3, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(c * 0.6, -c * 0.5, c * 0.38, c * 0.27, 0, 0, 7); ctx.fill();
      ctx.fillStyle = retro() ? 'rgba(0,0,0,0)' : 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(0, -c * 0.3, c * 0.4, c * 0.12, 0, 0, 7); ctx.fill();
      ctx.fillStyle = dk; for (const sx of [-0.45, -0.15, 0.15]) { ctx.beginPath(); ctx.moveTo(sx * c - c * 0.1, -c * 0.72); ctx.lineTo(sx * c, -c * 0.88); ctx.lineTo(sx * c + c * 0.1, -c * 0.72); ctx.fill(); }
      ctx.fillStyle = '#fff'; circle(c * 0.7, -c * 0.6, c * 0.1); ctx.fillStyle = '#1b1b1b'; circle(c * 0.73, -c * 0.6, c * 0.05);
    } else {
      // Beine
      ctx.fillStyle = dk;
      const l1 = dino.ground ? run : 0.4, l2 = dino.ground ? -run : -0.2;
      rr(-c * 0.3 + l1 * c * 0.12, -c * 0.4, c * 0.22, c * 0.4 - Math.max(0, l1) * c * 0.08, c * 0.08); ctx.fill();
      rr(c * 0.05 + l2 * c * 0.12, -c * 0.4, c * 0.22, c * 0.4 - Math.max(0, l2) * c * 0.08, c * 0.08); ctx.fill();
      ctx.fillStyle = col;
      // Schwanz
      ctx.beginPath(); ctx.moveTo(-c * 0.35, -c * 0.95); ctx.quadraticCurveTo(-c * 1.0, -c * 0.85 + run * c * 0.05, -c * 0.95, -c * 0.55); ctx.quadraticCurveTo(-c * 0.7, -c * 0.5, -c * 0.3, -c * 0.5); ctx.fill();
      // Körper
      ctx.beginPath(); ctx.ellipse(0, -c * 0.75, c * 0.48, c * 0.42, 0, 0, 7); ctx.fill();
      // Hals und Kopf
      rr(c * 0.05, -c * 1.45, c * 0.38, c * 0.6, c * 0.18); ctx.fill();
      ctx.beginPath(); ctx.ellipse(c * 0.42, -c * 1.5, c * 0.42, c * 0.3, 0, 0, 7); ctx.fill();
      // Bauch
      ctx.fillStyle = retro() ? 'rgba(0,0,0,0)' : 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(c * 0.1, -c * 0.62, c * 0.26, c * 0.24, 0, 0, 7); ctx.fill();
      // Rückenzacken
      ctx.fillStyle = dk;
      for (const [sx, sy] of [[-0.42, -0.95], [-0.2, -1.12], [0.05, -1.55]]) { ctx.beginPath(); ctx.moveTo(sx * c - c * 0.1, sy * c + c * 0.06); ctx.lineTo(sx * c - c * 0.05, sy * c - c * 0.14); ctx.lineTo(sx * c + c * 0.1, sy * c + c * 0.02); ctx.fill(); }
      // Ärmchen
      ctx.strokeStyle = dk; ctx.lineWidth = c * 0.1; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(c * 0.3, -c * 0.8); ctx.lineTo(c * 0.48, -c * 0.66 + run * c * 0.04); ctx.stroke();
      // Auge, Nasenloch, Mund
      ctx.fillStyle = '#fff'; circle(c * 0.48, -c * 1.6, c * 0.12);
      ctx.fillStyle = '#1b1b1b'; circle(c * 0.52, -c * 1.6, c * 0.06);
      if (state === 'over') { ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = c * 0.04; ctx.beginPath(); ctx.moveTo(c * 0.4, -c * 1.7); ctx.lineTo(c * 0.58, -c * 1.5); ctx.moveTo(c * 0.58, -c * 1.7); ctx.lineTo(c * 0.4, -c * 1.5); ctx.stroke(); }
      ctx.fillStyle = retro() ? 'rgba(0,0,0,0)' : 'rgba(255,120,150,.45)'; circle(c * 0.55, -c * 1.38, c * 0.06);
      ctx.fillStyle = dk; circle(c * 0.78, -c * 1.56, c * 0.03);
      ctx.strokeStyle = dk; ctx.lineWidth = c * 0.035; ctx.beginPath(); ctx.moveTo(c * 0.6, -c * 1.38); ctx.quadraticCurveTo(c * 0.72, -c * 1.33, c * 0.8, -c * 1.42); ctx.stroke();
    }
    ctx.restore();
  }

  function drawObstacle(o, w, c) {
    const x = o.x * c, y = o.y * c, ow = o.w * c, oh = o.h * c;
    if (o.type === 'rock') {
      for (let i = 0; i < o.n; i++) {
        const rx = x + i * c * 0.95;
        ctx.fillStyle = shade(w.rock, 0.75); rr(rx, y + c * 0.1, c * 0.95, oh - c * 0.1, c * 0.3); ctx.fill();
        ctx.fillStyle = w.rock; rr(rx + c * 0.04, y, c * 0.87, oh - c * 0.12, c * 0.3); ctx.fill();
        ctx.fillStyle = w.rockTop; rr(rx + c * 0.18, y + c * 0.1, c * 0.4, c * 0.16, c * 0.08); ctx.fill();
      }
    } else if (o.type === 'bush') {
      ctx.fillStyle = shade(w.bush, 0.75); rr(x + ow * 0.1, y + c * 0.3, ow * 0.8, oh - c * 0.3, c * 0.2); ctx.fill();
      ctx.fillStyle = w.bush;
      const n = Math.round(o.h * 2.2);
      for (let i = 0; i < n; i++) circle(x + ow * (0.3 + 0.4 * (i % 2)), y + c * 0.3 + i * (oh - c * 0.5) / n, c * 0.32);
      ctx.fillStyle = w.bushTop; circle(x + ow * 0.42, y + c * 0.25, c * 0.14);
      ctx.fillStyle = retro() ? '#fff' : '#e53935'; circle(x + ow * 0.68, y + oh * 0.5, c * 0.07); circle(x + ow * 0.3, y + oh * 0.72, c * 0.07);
    } else {
      // Biene
      const by = y + oh / 2 + Math.sin(t * 6 + o.x) * c * 0.12, bx = x + ow / 2;
      ctx.fillStyle = retro() ? '#c4c4c4' : 'rgba(255,255,255,.75)';
      const wf = Math.sin(t * 40) * 0.3;
      ctx.beginPath(); ctx.ellipse(bx + c * 0.05, by - c * 0.28, c * 0.2, c * 0.12, -0.5 + wf, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(bx + c * 0.25, by - c * 0.25, c * 0.16, c * 0.1, 0.4 - wf, 0, 7); ctx.fill();
      ctx.fillStyle = retro() ? '#9a9a9a' : '#f9c02d'; ctx.beginPath(); ctx.ellipse(bx, by, c * 0.42, c * 0.28, 0, 0, 7); ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.ellipse(bx, by, c * 0.42, c * 0.28, 0, 0, 7); ctx.clip();
      ctx.fillStyle = '#2b2b2b'; ctx.fillRect(bx - c * 0.05, by - c * 0.3, c * 0.12, c * 0.6); ctx.fillRect(bx + c * 0.18, by - c * 0.3, c * 0.1, c * 0.6);
      ctx.restore();
      ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.moveTo(bx + c * 0.4, by - c * 0.05); ctx.lineTo(bx + c * 0.55, by); ctx.lineTo(bx + c * 0.4, by + c * 0.05); ctx.fill();
      ctx.fillStyle = '#fff'; circle(bx - c * 0.24, by - c * 0.06, c * 0.08); ctx.fillStyle = '#1b1b1b'; circle(bx - c * 0.27, by - c * 0.06, c * 0.04);
    }
  }

  function draw() {
    if (!dino) return;
    const w = W(), pix = retro(), c = pix ? PX : cell;
    if (pix) {
      ctx = offCtx;
      if (offCv.width !== COLS * PX) { offCv.width = COLS * PX; offCv.height = ROWS * PX; }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    } else { ctx = main; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
    if (shake) ctx.translate((Math.random() - 0.5) * shake * 14, (Math.random() - 0.5) * shake * 14);
    // Rasen im Schachbrettmuster, scrollt mit
    const off = scroll % 2;
    for (let y = 0; y < GROUND; y++) for (let x = -2; x < COLS + 2; x++) {
      ctx.fillStyle = w.grass[(x + y + 200) & 1]; ctx.fillRect((x - off) * c, y * c, c + 1, c + 1);
    }
    const gy = GROUND * c;
    if (retro()) {
      ctx.fillStyle = '#fff'; ctx.fillRect(0, gy, COLS * c, ROWS * c - gy);
      ctx.fillStyle = '#d2d2d2';
      for (let i = 0; i < 4; i++) {
        const cx = ((i * 7.3 - scroll * 0.25) % (COLS + 6) + COLS + 6) % (COLS + 6) - 3, cy = 1.2 + (i % 3) * 1.3;
        rr(cx * c, cy * c, c * 1.6, c * 0.35, c * 0.18); ctx.fill(); rr((cx + 0.4) * c, (cy - 0.25) * c, c * 0.8, c * 0.4, c * 0.2); ctx.fill();
      }
      ctx.fillStyle = '#535353'; ctx.fillRect(0, gy - c * 0.04, COLS * c, Math.max(1.5, c * 0.06));
      for (let i = 0; i < 40; i++) {
        const px = ((i * 2.37 - scroll) % (COLS + 2) + COLS + 2) % (COLS + 2) - 1;
        ctx.fillRect(px * c, gy + c * (0.25 + (i * 37 % 7) * 0.12), c * (0.1 + (i % 3) * 0.08), Math.max(1, c * 0.05));
      }
    } else {
    // Boden
    ctx.fillStyle = w.ground; ctx.fillRect(0, gy, COLS * c, ROWS * c - gy);
    ctx.fillStyle = w.groundTop;
    const go = (scroll * c) % c;
    for (let x = -go; x < COLS * c + c; x += c) { rr(x + 2, gy, c - 4, c * 0.3, c * 0.12); ctx.fill(); }
    ctx.fillStyle = 'rgba(0,0,0,.12)';
    for (let x = -((scroll * c * 1) % (c * 3)); x < COLS * c; x += c * 3) { circle(x + c * 0.7, gy + c * 0.9, c * 0.08); circle(x + c * 2.1, gy + c * 1.4, c * 0.06); }
    }

    for (const o of obs) drawObstacle(o, w, c);
    for (const p of parts) { ctx.globalAlpha = p.life / 0.35; ctx.fillStyle = w.groundTop; circle(p.x * c, p.y * c, c * 0.08); }
    ctx.globalAlpha = 1;
    drawDino(c);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (pix) {
      // Mond und Sterne (werden in der Nacht durch das Invertieren hell)
      if (night) {
        ctx.fillStyle = '#bdbdbd';
        ctx.beginPath(); ctx.arc(COLS * PX * 0.78, PX * 2.2, PX * 0.9, 0, 7); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(COLS * PX * 0.78 + PX * 0.45, PX * 2.0, PX * 0.8, 0, 7); ctx.fill();
        ctx.fillStyle = '#9a9a9a';
        for (let i = 0; i < 14; i++) ctx.fillRect(((i * 53 * PX / 9) % (COLS * PX)), 4 + (i * 29) % (PX * 5), 4, 4);
      }
      // Kanten hart machen: jedes Pixel auf einen von vier Grautönen runden
      const img = ctx.getImageData(0, 0, offCv.width, offCv.height), d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const l = d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11;
        const q = l > 232 ? 255 : l > 180 ? 210 : l > 120 ? 154 : 83;
        d[i] = d[i + 1] = d[i + 2] = q; d[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      ctx = main;
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;
      ctx.drawImage(offCv, 0, 0, cv.width, cv.height);
      // Retro-Zählanzeige oben rechts im Feld
      const fs = Math.round(cell * 0.5 * dpr);
      ctx.font = `${fs}px 'Press Start 2P', monospace`; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
      ctx.fillStyle = '#9a9a9a'; ctx.fillText('REKORD ' + best, cv.width - fs * 8, fs * 3);
      ctx.fillStyle = '#535353'; ctx.fillText(String(score), cv.width - fs * 1.5, fs * 3);
    }
  }

  let last = performance.now();
  function frame(now) {
    let dt = Math.min((now - last) / 1000, 0.05); last = now;
    while (dt > 0) { const s = Math.min(dt, 1 / 120); update(s); dt -= s; }
    draw(); requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  buildMenu(); applyWorld(); newRound(); updSound(); resize(); openMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
