<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#4a752c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Flappy Bird – Arcadia</title>
<script src="/arcadia.js?v=14"></script>
<link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --hud: #4a752c; --frame: #578a34; --ink: #203018; --muted: #6b7d5c; --soft: #f1f7e8; --soft-2: #e3efd3;
    --blue: #3f6ff0; --blue-dark: #2b51c4; --p1: #6fa344; --p2: #3f6a24; --p3: #294a15; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Fredoka', system-ui, sans-serif; color: #fff; overflow: hidden; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    background: radial-gradient(120% 90% at 50% 0%, var(--p1) 0%, var(--p2) 55%, var(--p3) 100%) fixed var(--p2);
    display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; }
  button { font-family: inherit; touch-action: manipulation; }
  .hidden { display: none !important; }
  #app { display: flex; flex-direction: column; }
  #hud { display: flex; align-items: center; gap: 14px; min-height: 54px; background: var(--hud); padding: 6px 10px 6px 14px;
    border-radius: 16px 16px 0 0; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .stat { display: flex; align-items: center; gap: 7px; font-size: 22px; font-weight: 600; }
  .stat svg { width: 26px; height: 26px; }
  .grow { flex: 1; }
  .icon-btn { width: 40px; height: 40px; border: 0; border-radius: 12px; cursor: pointer; background: rgba(255,255,255,.12);
    color: #fff; font-size: 20px; display: grid; place-items: center; }
  .icon-btn:hover { background: rgba(255,255,255,.22); }
  #frame { position: relative; background: var(--frame); padding: 10px; border-radius: 0 0 16px 16px; box-shadow: 0 18px 40px rgba(0,0,0,.3); }
  #board { display: block; border-radius: 6px; touch-action: none; }
  #hint { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); padding: 12px 18px; border-radius: 16px;
    background: rgba(16,26,10,.8); text-align: center; font-size: 16px; pointer-events: none; white-space: nowrap; }
  #hint b { display: block; font-size: 19px; }

  #menu { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(20,35,10,.45); z-index: 5; padding: 14px; }
  .card { position: relative; width: min(440px, 100%); max-height: calc(100dvh - 28px); overflow: auto; background: #fff; color: var(--ink);
    border-radius: 22px; padding: 22px 20px 20px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .home { position: absolute; top: 14px; left: 16px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; }
  h1 { margin: 10px 0 2px; text-align: center; font-size: 34px; color: var(--hud); }
  .result { text-align: center; color: var(--muted); font-size: 17px; margin: 0 0 12px; min-height: 22px; }
  .result b { color: var(--ink); }
  .row { margin: 10px 0; }
  .row label { display: block; font-size: 14px; font-weight: 600; color: var(--muted); margin: 0 0 5px 4px; }
  .seg { display: flex; gap: 2px; padding: 3px; border-radius: 13px; background: var(--soft); }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 10px; font-size: 15px; font-weight: 600;
    color: var(--muted); cursor: pointer; white-space: nowrap; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .seg.colors button { height: 34px; padding: 0; }
  .seg.colors button i { display: inline-block; width: 20px; height: 20px; border-radius: 50%; vertical-align: middle; }
  .seg.colors button.on i { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--ink); }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; border: 0; border-radius: 14px; padding: 13px 20px; font-size: 18px; font-weight: 600; cursor: pointer; background: var(--soft-2); color: var(--ink); }
  .btn.primary { background: var(--blue); color: #fff; box-shadow: 0 4px 0 var(--blue-dark); }
  .btn.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--blue-dark); }
  .modeinfo { margin: 6px 4px 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
  .seg button:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat" title="Punkte"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z" fill="#ffd54f"/></svg><span id="score">0</span></div>
    <div class="stat" title="Rekord"><svg viewBox="0 0 24 24"><path d="M6 3h12v3a6 6 0 0 1-5 5.9V15h3v3H8v-3h3v-3.1A6 6 0 0 1 6 6z" fill="#ffca28"/><path d="M6 5H3a3 3 0 0 0 3 4M18 5h3a3 3 0 0 1-3 4" fill="none" stroke="#ffca28" stroke-width="2"/></svg><span id="best">0</span></div>
    <div class="grow"></div>
    <button class="icon-btn" id="sound" type="button" title="Ton (M)">♪</button>
    <button class="icon-btn" id="open-menu" type="button" title="Menü (Esc)">☰</button>
  </div>
  <div id="frame">
    <canvas id="board"></canvas>
    <div id="hint"><b>Tippen oder Leertaste</b>zum Losfliegen</div>
  </div>
</div>

<div id="menu">
  <div class="card">
    <a class="home" href="/">‹ Arcadia</a>
    <h1>Flappy Bird</h1>
    <p class="result" id="result"></p>
    <div class="row"><label>Modus</label><div class="seg" data-s="mode"></div><p class="modeinfo" id="modeinfo"></p></div>
    <div class="row"><label>Tempo</label><div class="seg" data-s="speed"></div></div>
    <div class="row"><label>Lücke</label><div class="seg" data-s="gap"></div></div>
    <div class="row"><label>Abstand der Säulen</label><div class="seg" data-s="spacing"></div></div>
    <div class="row"><label>Schwerkraft</label><div class="seg" data-s="gravity"></div></div>
    <div class="row"><label>Wird schwerer</label><div class="seg" data-s="ramp"></div></div>
    <div class="row"><label>Welt</label><div class="seg" data-s="world"></div></div>
    <div class="row"><label>Farbe</label><div class="seg colors" data-s="color"></div></div>
    <div class="actions">
      <button class="btn" id="reset" type="button">Zurücksetzen</button>
      <button class="btn primary" id="start" type="button">Spielen</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const cv = $('board'), ctx = cv.getContext('2d');

  // ---------- Einstellungen ----------
  const OPTS = {
    mode: { label: ['Rekord-Modus', 'Frei spielen'], val: [1, 0], def: 0 },
    speed:   { label: ['Langsam', 'Normal', 'Schnell', 'Turbo'], val: [110, 150, 195, 245], def: 1 },
    gap:     { label: ['Klein', 'Mittel', 'Groß', 'Riesig'], val: [3.0, 3.6, 4.3, 5.2], def: 1 },
    spacing: { label: ['Eng', 'Normal', 'Weit'], val: [4.2, 5.4, 6.8], def: 1 },
    gravity: { label: ['Leicht', 'Normal', 'Stark'], val: [0.75, 1, 1.3], def: 1 },
    ramp:    { label: ['Aus', 'An'], val: [0, 1], def: 1 },
    world:   { label: ['Wiese', 'Wüste', 'Schnee', 'Nacht'], val: ['meadow', 'desert', 'snow', 'night'], def: 0 },
    color:   { label: ['', '', '', '', '', ''], val: ['#4e7cf6', '#ef4f8b', '#f58a1f', '#f4c20d', '#9a5cf0', '#14b8a6'], def: 0 },
  };
  const WORLDS = {
    meadow: { grass: ['#aad751', '#a2d149'], frame: '#578a34', hud: '#4a752c', page: ['#6fa344', '#3f6a24', '#294a15'], wall: '#4f7f2c', top: '#6c9e40', side: '#365d1d', ground: '#8b5a2b' },
    desert: { grass: ['#f2d58e', '#eacb7e'], frame: '#c99a4b', hud: '#a87a33', page: ['#efcd84', '#c29445', '#8c6526'], wall: '#d49a4c', top: '#ebbb6c', side: '#a4702e', ground: '#a87a33' },
    snow:   { grass: ['#f3f8fc', '#e5eff6'], frame: '#8fb6d1', hud: '#5d8db0', page: ['#d7ebf7', '#86afcd', '#557f9f'], wall: '#9fd0ea', top: '#d2edfa', side: '#6aa5c8', ground: '#5d8db0' },
    night:  { grass: ['#2f4b2b', '#2a4427'], frame: '#1d321a', hud: '#152613', page: ['#2a462c', '#132414', '#070f08'], wall: '#1f3a1a', top: '#30562a', side: '#112410', ground: '#152613' },
  };
  const set = {};
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('flug.settings') || '{}'); } catch (e) {}
  for (const k in OPTS) set[k] = Number.isInteger(saved[k]) && saved[k] < OPTS[k].val.length ? saved[k] : OPTS[k].def;
  // Rekord-Modus: feste Standard-Einstellungen, nur dann zählen Rekorde
  const REC = { speed: 1, gap: 1, spacing: 1, gravity: 1, ramp: 1 };
  const rec = () => set.mode === 0;
  const idx = (k) => (rec() && k in REC ? REC[k] : set[k]);
  const v = (k) => OPTS[k].val[idx(k)];
  const save = () => { try { localStorage.setItem('flug.settings', JSON.stringify(set)); } catch (e) {} };
  const bestKey = () => 'flug.rec';
  const getBest = () => { if (!rec()) return 0; try { return +localStorage.getItem(bestKey()) || 0; } catch (e) { return 0; } };

  function buildMenu() {
    const mi = document.getElementById('modeinfo');
    if (mi) mi.textContent = rec() ? 'Feste Einstellungen, nur hier zählen Rekorde: Tempo Normal · Lücke Mittel · Abstand Normal · wird schwerer.' : 'Eigene Einstellungen, hier werden keine Rekorde gespeichert.';
    document.querySelectorAll('.seg[data-s]').forEach((seg) => {
      const k = seg.dataset.s; seg.innerHTML = '';
      OPTS[k].label.forEach((l, i) => {
        const b = document.createElement('button'); b.type = 'button';
        if (k === 'color') { b.innerHTML = `<i style="background:${OPTS.color.val[i]}"></i>`; b.title = 'Farbe ' + (i + 1); }
        else b.textContent = l;
        b.className = i === idx(k) ? 'on' : '';
        if (rec() && k in REC) b.disabled = true;
        b.onclick = () => { set[k] = i; save(); buildMenu(); applyWorld(); newRound(); draw(); };
        seg.appendChild(b);
      });
    });
  }

  // ---------- Spielfeld ----------
  const COLS = 17, ROWS = 15; // in Kästchen; alles wird in Kästchen gerechnet
  let cell = 30, dpr = 1;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    const maxW = innerWidth - 24, maxH = innerHeight - 54 - 36;
    cell = Math.max(14, Math.floor(Math.min(maxW / COLS, maxH / ROWS)));
    cv.width = COLS * cell * dpr; cv.height = ROWS * cell * dpr;
    cv.style.width = COLS * cell + 'px'; cv.style.height = ROWS * cell + 'px';
    draw();
  }

  function applyWorld() {
    const w = WORLDS[v('world')];
    $('hud').style.background = w.hud; $('frame').style.background = w.frame;
    document.body.style.background = `radial-gradient(120% 90% at 50% 0%, ${w.page[0]} 0%, ${w.page[1]} 55%, ${w.page[2]} 100%) fixed ${w.page[1]}`;
    document.querySelector('meta[name=theme-color]').content = w.hud;
  }

  // ---------- Spielzustand ----------
  const GROUND = ROWS - 1.2, R = 0.42;
  let state = 'ready', bird, pillars, score, best, t = 0, deadT = 0, shake = 0, parts = [];
  function newRound() {
    bird = { x: 4.5, y: ROWS * 0.42, vy: 0 };
    pillars = []; score = 0; parts = []; best = getBest();
    for (let i = 0; i < 5; i++) addPillar(COLS + 2 + i * v('spacing'));
    $('score').textContent = 0; $('best').textContent = best;
    state = 'ready'; $('hint').classList.remove('hidden');
  }
  function curGap() { return Math.max(v('gap') - (v('ramp') ? score * 0.03 : 0), 2.6); }
  function addPillar(x) {
    const gap = curGap(), top = 1.2 + Math.random() * (GROUND - 2.4 - gap);
    pillars.push({ x, gap, y: top, done: false });
  }

  // ---------- Ton ----------
  let ac, sound = true;
  try { sound = localStorage.getItem('flug.sound') !== '0'; } catch (e) {}
  const updSound = () => { $('sound').style.opacity = sound ? 1 : 0.45; };
  function beep(f, d = 0.08, type = 'triangle', vol = 0.06) {
    if (!sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, ac.currentTime); o.frequency.exponentialRampToValueAtTime(f * 1.4, ac.currentTime + d);
      g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }

  // ---------- Steuerung ----------
  const menuOpen = () => !$('menu').classList.contains('hidden');
  function openMenu() {
    if (state === 'play') state = 'pause';
    const r = $('result');
    r.innerHTML = state === 'over' ? `Punkte: <b>${score}</b> · Rekord: <b>${best}</b>` : (state === 'pause' ? 'Pause' : 'Flieg durch die Röhren!');
    $('start').textContent = state === 'pause' ? 'Weiter' : (state === 'over' ? 'Nochmal' : 'Spielen');
    $('menu').classList.remove('hidden');
  }
  function closeMenu() {
    $('menu').classList.add('hidden');
    if (state === 'over') newRound();
    if (state === 'pause') state = 'play';
  }
  function flap() {
    if (menuOpen()) return;
    if (state === 'over') { if (deadT > 0.45) { newRound(); } return; }
    if (state === 'ready') { state = 'play'; $('hint').classList.add('hidden'); }
    if (state === 'pause') state = 'play';
    bird.vy = -10.2 * Math.sqrt(v('gravity'));
    beep(480, 0.08);
    for (let i = 0; i < 4; i++) parts.push({ x: bird.x - 0.3, y: bird.y + 0.2, vx: -1 - Math.random() * 2, vy: Math.random() * 2, life: 0.4 });
  }
  $('board').addEventListener('pointerdown', (e) => { e.preventDefault(); flap(); });
  $('hint').addEventListener('pointerdown', flap);
  $('start').onclick = closeMenu;
  $('open-menu').onclick = openMenu;
  $('reset').onclick = () => { for (const k in OPTS) set[k] = OPTS[k].def; save(); buildMenu(); applyWorld(); newRound(); };
  $('sound').onclick = () => { sound = !sound; try { localStorage.setItem('flug.sound', sound ? '1' : '0'); } catch (e) {} updSound(); };
  addEventListener('keydown', (e) => {
    const k = e.code || e.key;
    if (k === 'Escape' || k === 'KeyP' || k === 'p') { e.preventDefault(); menuOpen() ? closeMenu() : openMenu(); return; }
    if (k === 'KeyM' || k === 'm') { $('sound').click(); return; }
    if (k === 'Space' || k === ' ' || k === 'ArrowUp' || k === 'KeyW' || k === 'w' || k === 'Enter' || e.keyCode === 32) {
      e.preventDefault(); if (e.repeat) return;
      if (menuOpen()) { if (k === 'Enter' || k === 'Space' || k === ' ') closeMenu(); return; }
      flap();
    }
  }, true);
  addEventListener('blur', () => { if (state === 'play') openMenu(); });

  function die() {
    window.Arcadia && Arcadia.xp(Math.min(120, 5 + score * 2), 'Flappy Bird');
    state = 'over'; deadT = 0; shake = 0.35; beep(160, 0.35, 'sawtooth', 0.07);
    if (score > best) { best = score; try { if (rec()) localStorage.setItem(bestKey(), best); } catch (e) {} $('best').textContent = best; }
    setTimeout(() => { if (state === 'over' && !menuOpen()) openMenu(); }, 750);
  }

  function update(dt) {
    t += dt; shake = Math.max(0, shake - dt);
    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    parts = parts.filter((p) => p.life > 0);
    if (state === 'ready') { bird.y = ROWS * 0.42 + Math.sin(t * 4) * 0.25; return; }
    if (state === 'pause') return;
    const g = 34 * v('gravity');
    if (state === 'over') { deadT += dt; if (bird.y < GROUND - R) { bird.vy += g * dt; bird.y = Math.min(bird.y + bird.vy * dt, GROUND - R); } return; }
    bird.vy = Math.min(bird.vy + g * dt, 16); bird.y += bird.vy * dt;
    const sp = (v('speed') + (v('ramp') ? Math.min(score * 2.5, 90) : 0)) / 30;
    for (const p of pillars) {
      p.x -= sp * dt;
      if (!p.done && p.x + 1 < bird.x) {
        p.done = true; score++; $('score').textContent = score; beep(880, 0.1, 'square', 0.04);
      }
      if (bird.x + R > p.x && bird.x - R < p.x + 1.6) {
        const cx = Math.max(p.x, Math.min(bird.x, p.x + 1.6));
        for (const [a, b] of [[-5, p.y], [p.y + p.gap, GROUND]]) {
          const cy = Math.max(a, Math.min(bird.y, b));
          if ((bird.x - cx) ** 2 + (bird.y - cy) ** 2 < R * R * 0.85) return die();
        }
      }
    }
    if (pillars[0].x < -3) { pillars.shift(); addPillar(pillars[pillars.length - 1].x + v('spacing')); }
    if (bird.y > GROUND - R) { bird.y = GROUND - R; return die(); }
    if (bird.y < R) { bird.y = R; bird.vy = 0; }
  }

  // ---------- Zeichnen ----------
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
  function draw() {
    if (!bird) return;
    const w = WORLDS[v('world')], c = cell;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (shake) ctx.translate((Math.random() - 0.5) * shake * 14, (Math.random() - 0.5) * shake * 14);
    // Rasen im Schachbrettmuster
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      ctx.fillStyle = w.grass[(x + y) & 1]; ctx.fillRect(x * c, y * c, c + 1, c + 1);
    }
    // Säulen wie die Steine bei Snake: abgerundet mit heller Oberseite und dunkler Seite
    for (const p of pillars) {
      const x = p.x * c, pw = 1.6 * c, r = c * 0.28;
      for (const [y0, y1, cap] of [[-1, p.y, p.y], [p.y + p.gap, GROUND, p.y + p.gap]]) {
        const top = y0 * c, h = (y1 - y0) * c;
        ctx.fillStyle = w.side; rr(x, top + c * 0.12, pw, h, r); ctx.fill();
        ctx.fillStyle = w.wall; rr(x, top, pw, h - c * 0.1, r); ctx.fill();
        ctx.fillStyle = w.top; rr(x - c * 0.15, cap * c - (cap === p.y ? c * 0.55 : 0), pw + c * 0.3, c * 0.55, r); ctx.fill();
      }
    }
    // Boden
    const gy = GROUND * c;
    ctx.fillStyle = w.ground; ctx.fillRect(0, gy, COLS * c, ROWS * c - gy);
    ctx.fillStyle = w.top;
    const off = state === 'play' ? (t * v('speed') / 30 * c) % c : 0;
    for (let x = -off; x < COLS * c + c; x += c) { rr(x + 2, gy, c - 4, c * 0.3, c * 0.12); ctx.fill(); }
    // Partikel
    for (const p of parts) { ctx.globalAlpha = p.life / 0.4; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x * c, p.y * c, c * 0.09, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
    // Spieler: kleiner Vogel mit Schopf, Schnabel, Bauch, Schwanzfedern und schlagendem Flügel
    const col = v('color'), u = c;
    const dark = (k) => { const n = parseInt(col.slice(1), 16); return `rgb(${(n >> 16) * k / 100},${(n >> 8 & 255) * k / 100},${(n & 255) * k / 100})`; };
    ctx.save(); ctx.translate(bird.x * c, bird.y * c);
    ctx.rotate(Math.max(-0.45, Math.min(1.1, bird.vy / 14)));
    ctx.lineJoin = 'round';
    // Schwanzfedern
    ctx.fillStyle = dark(70);
    for (const a of [-0.35, 0, 0.35]) {
      ctx.save(); ctx.rotate(a); ctx.beginPath(); ctx.ellipse(-u * 0.5, 0, u * 0.2, u * 0.08, 0, 0, 7); ctx.fill(); ctx.restore();
    }
    // Füße
    ctx.strokeStyle = '#f08a24'; ctx.lineWidth = u * 0.06; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-u * 0.05, u * 0.36); ctx.lineTo(-u * 0.1, u * 0.5); ctx.moveTo(u * 0.08, u * 0.36); ctx.lineTo(u * 0.05, u * 0.5); ctx.stroke();
    // Körper
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0, 0, u * 0.46, u * 0.4, 0, 0, 7); ctx.fill();
    // Bauch
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(u * 0.08, u * 0.16, u * 0.26, u * 0.19, 0, 0, 7); ctx.fill();
    // Schopf
    ctx.fillStyle = dark(70);
    ctx.beginPath(); ctx.moveTo(-u * 0.02, -u * 0.36); ctx.quadraticCurveTo(-u * 0.12, -u * 0.62, u * 0.06, -u * 0.55);
    ctx.quadraticCurveTo(u * 0.05, -u * 0.45, u * 0.12, -u * 0.36); ctx.fill();
    // Schnabel
    ctx.fillStyle = '#ffb02e'; ctx.beginPath(); ctx.moveTo(u * 0.36, -u * 0.1); ctx.lineTo(u * 0.66, -u * 0.01); ctx.lineTo(u * 0.36, u * 0.05); ctx.fill();
    ctx.fillStyle = '#f08a24'; ctx.beginPath(); ctx.moveTo(u * 0.36, -u * 0.01); ctx.lineTo(u * 0.6, u * 0.0); ctx.lineTo(u * 0.36, u * 0.08); ctx.fill();
    // Auge
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(u * 0.2, -u * 0.13, u * 0.13, 0, 7); ctx.fill();
    ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.arc(u * 0.24, -u * 0.13, u * 0.065, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(u * 0.26, -u * 0.16, u * 0.022, 0, 7); ctx.fill();
    // Wange
    ctx.fillStyle = 'rgba(255,120,150,.45)'; ctx.beginPath(); ctx.arc(u * 0.22, u * 0.06, u * 0.06, 0, 7); ctx.fill();
    // Flügel: schlägt beim Hochfliegen kräftig
    const flapAmt = state === 'over' ? 0.3 : (state === 'play' && bird.vy < 0 ? Math.sin(t * 28) : Math.sin(t * 8) * 0.4);
    ctx.save(); ctx.translate(-u * 0.08, u * 0.02); ctx.rotate(-0.2 - flapAmt * 0.7);
    ctx.fillStyle = dark(78); ctx.beginPath(); ctx.ellipse(-u * 0.12, 0, u * 0.24, u * 0.13, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = u * 0.03;
    ctx.beginPath(); ctx.moveTo(-u * 0.3, 0); ctx.lineTo(-u * 0.05, 0); ctx.stroke();
    ctx.restore();
    ctx.restore();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  let last = performance.now();
  function frame(now) {
    let dt = Math.min((now - last) / 1000, 0.05); last = now;
    while (dt > 0) { const s = Math.min(dt, 1 / 120); update(s); dt -= s; }
    draw(); requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  buildMenu(); applyWorld(); newRound(); updSound(); resize(); openMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
