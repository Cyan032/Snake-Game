<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#4a752c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Blockfall – Arcadia</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --hud: #4a752c; --frame: #578a34; --ink: #203018; --muted: #6b7d5c; --soft: #f1f7e8; --soft-2: #e3efd3;
    --blue: #3f6ff0; --blue-dark: #2b51c4; --p1: #6fa344; --p2: #3f6a24; --p3: #294a15; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Fredoka', system-ui, sans-serif; color: #fff; overflow: hidden; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    background: radial-gradient(120% 90% at 50% 0%, var(--p1) 0%, var(--p2) 55%, var(--p3) 100%) fixed var(--p2);
    display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; }
  button { font-family: inherit; touch-action: manipulation; }
  .hidden { display: none !important; }
  #app { display: flex; flex-direction: column; }
  #hud { display: flex; align-items: center; gap: 14px; min-height: 54px; background: var(--hud); padding: 6px 10px 6px 14px;
    border-radius: 16px 16px 0 0; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .stat { display: flex; align-items: center; gap: 7px; font-size: 22px; font-weight: 600; }
  .stat svg { width: 26px; height: 26px; }
  .grow { flex: 1; }
  .icon-btn { width: 40px; height: 40px; border: 0; border-radius: 12px; cursor: pointer; background: rgba(255,255,255,.12);
    color: #fff; font-size: 20px; display: grid; place-items: center; }
  .icon-btn:hover { background: rgba(255,255,255,.22); }
  #frame { position: relative; background: var(--frame); padding: 10px; border-radius: 0 0 16px 16px; box-shadow: 0 18px 40px rgba(0,0,0,.3); }
  #board { display: block; border-radius: 6px; touch-action: none; }
  #hint { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); padding: 12px 18px; border-radius: 16px;
    background: rgba(16,26,10,.8); text-align: center; font-size: 16px; pointer-events: none; white-space: nowrap; }
  #hint b { display: block; font-size: 19px; }

  #menu { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(20,35,10,.45); z-index: 5; padding: 14px; }
  .card { position: relative; width: min(440px, 100%); max-height: calc(100dvh - 28px); overflow: auto; background: #fff; color: var(--ink);
    border-radius: 22px; padding: 22px 20px 20px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .home { position: absolute; top: 14px; left: 16px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; }
  h1 { margin: 10px 0 2px; text-align: center; font-size: 34px; color: var(--hud); }
  .result { text-align: center; color: var(--muted); font-size: 17px; margin: 0 0 12px; min-height: 22px; }
  .result b { color: var(--ink); }
  .row { margin: 10px 0; }
  .row label { display: block; font-size: 14px; font-weight: 600; color: var(--muted); margin: 0 0 5px 4px; }
  .seg { display: flex; gap: 2px; padding: 3px; border-radius: 13px; background: var(--soft); }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 10px; font-size: 15px; font-weight: 600;
    color: var(--muted); cursor: pointer; white-space: nowrap; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .seg.colors button { height: 34px; padding: 0; }
  .seg.colors button i { display: inline-block; width: 20px; height: 20px; border-radius: 50%; vertical-align: middle; }
  .seg.colors button.on i { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--ink); }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; border: 0; border-radius: 14px; padding: 13px 20px; font-size: 18px; font-weight: 600; cursor: pointer; background: var(--soft-2); color: var(--ink); }
  .btn.primary { background: var(--blue); color: #fff; box-shadow: 0 4px 0 var(--blue-dark); }
  .btn.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--blue-dark); }
  #pad { display: none; gap: 8px; justify-content: center; margin-top: 10px; }
  body.touch #pad { display: flex; }
  #pad button { width: 58px; height: 52px; border: 0; border-radius: 14px; background: rgba(255,255,255,.18); color: #fff; font-size: 22px; font-weight: 700; }
  #pad button:active { background: rgba(255,255,255,.35); }
  .keys { font-size: 13px; color: var(--muted); text-align: center; margin: 12px 0 0; line-height: 1.6; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat" title="Punkte"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z" fill="#ffd54f"/></svg><span id="score">0</span></div>
    <div class="stat" title="Reihen"><svg viewBox="0 0 24 24"><rect x="3" y="14" width="18" height="6" rx="2" fill="#80deea"/><rect x="3" y="6" width="8" height="6" rx="2" fill="#80deea" opacity=".6"/></svg><span id="lines">0</span></div>
    <div class="stat" title="Level"><svg viewBox="0 0 24 24"><path d="M4 20V14h4v6zm6 0V9h4v11zm6 0V4h4v16z" fill="#a5d6a7"/></svg><span id="level">1</span></div>
    <div class="grow"></div>
    <button class="icon-btn" id="sound" type="button" title="Ton (M)">♪</button>
    <button class="icon-btn" id="open-menu" type="button" title="Menü (Esc)">☰</button>
  </div>
  <div id="frame">
    <canvas id="board"></canvas>
    <div id="hint"><b>Pfeiltasten oder WASD</b>Leertaste: fallen lassen</div>
  </div>
  <div id="pad">
    <button data-k="left">◀</button><button data-k="rot">⟳</button><button data-k="down">▼</button><button data-k="drop">⤓</button><button data-k="hold">H</button><button data-k="right">▶</button>
  </div>
</div>

<div id="menu">
  <div class="card">
    <a class="home" href="/">‹ Arcadia</a>
    <h1>Blockfall</h1>
    <p class="result" id="result"></p>
    <div class="row"><label>Start-Level</label><div class="seg" data-s="start"></div></div>
    <div class="row"><label>Wird schneller</label><div class="seg" data-s="ramp"></div></div>
    <div class="row"><label>Spielfeld</label><div class="seg" data-s="size"></div></div>
    <div class="row"><label>Vorschau</label><div class="seg" data-s="preview"></div></div>
    <div class="row"><label>Schatten-Stein</label><div class="seg" data-s="ghost"></div></div>
    <div class="row"><label>Halten</label><div class="seg" data-s="hold"></div></div>
    <div class="row"><label>Welt</label><div class="seg" data-s="world"></div></div>
    <div class="actions">
      <button class="btn" id="reset" type="button">Zurücksetzen</button>
      <button class="btn primary" id="start" type="button">Spielen</button>
    </div>
    <p class="keys">◀ ▶ bewegen · ▲ / W drehen · Z andersrum · ▼ schneller<br>Leertaste: fallen lassen · C / Shift: halten · Esc: Pause</p>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const cv = $('board'), ctx = cv.getContext('2d');

  // ---------- Einstellungen ----------
  const OPTS = {
    start:   { label: ['1', '3', '5', '8', '10'], val: [1, 3, 5, 8, 10], def: 0 },
    ramp:    { label: ['Aus', 'An'], val: [0, 1], def: 1 },
    size:    { label: ['Klein', 'Normal', 'Breit'], val: [[8, 16], [10, 20], [12, 20]], def: 1 },
    preview: { label: ['Aus', '1', '3'], val: [0, 1, 3], def: 2 },
    ghost:   { label: ['Aus', 'An'], val: [0, 1], def: 1 },
    hold:    { label: ['Aus', 'An'], val: [0, 1], def: 1 },
    world:   { label: ['Wiese', 'Wüste', 'Schnee', 'Nacht'], val: ['meadow', 'desert', 'snow', 'night'], def: 0 },
  };
  const WORLDS = {
    meadow: { grass: ['#aad751', '#a2d149'], frame: '#578a34', hud: '#4a752c', page: ['#6fa344', '#3f6a24', '#294a15'], panel: '#8fbf45' },
    desert: { grass: ['#f2d58e', '#eacb7e'], frame: '#c99a4b', hud: '#a87a33', page: ['#efcd84', '#c29445', '#8c6526'], panel: '#dcb56b' },
    snow:   { grass: ['#f3f8fc', '#e5eff6'], frame: '#8fb6d1', hud: '#5d8db0', page: ['#d7ebf7', '#86afcd', '#557f9f'], panel: '#cfe2ef' },
    night:  { grass: ['#2f4b2b', '#2a4427'], frame: '#1d321a', hud: '#152613', page: ['#2a462c', '#132414', '#070f08'], panel: '#24391f' },
  };
  const set = {};
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('block.settings') || '{}'); } catch (e) {}
  for (const k in OPTS) set[k] = Number.isInteger(saved[k]) && saved[k] < OPTS[k].val.length ? saved[k] : OPTS[k].def;
  const v = (k) => OPTS[k].val[set[k]];
  const save = () => { try { localStorage.setItem('block.settings', JSON.stringify(set)); } catch (e) {} };
  const bestKey = () => 'block.best.' + [set.start, set.ramp, set.size].join('');
  const getBest = () => { try { return +localStorage.getItem(bestKey()) || 0; } catch (e) { return 0; } };

  function buildMenu() {
    document.querySelectorAll('.seg[data-s]').forEach((seg) => {
      const k = seg.dataset.s; seg.innerHTML = '';
      OPTS[k].label.forEach((l, i) => {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = l;
        b.className = i === set[k] ? 'on' : '';
        b.onclick = () => { set[k] = i; save(); buildMenu(); applyWorld(); newRound(); resize(); };
        seg.appendChild(b);
      });
    });
  }

  // ---------- Steine (Farben aus Snake) ----------
  const SHAPES = {
    I: { c: '#4e7cf6', m: [[0, 1], [1, 1], [2, 1], [3, 1]], n: 4 },
    O: { c: '#f4c20d', m: [[1, 0], [2, 0], [1, 1], [2, 1]], n: 4 },
    T: { c: '#9a5cf0', m: [[1, 0], [0, 1], [1, 1], [2, 1]], n: 3 },
    S: { c: '#43a047', m: [[1, 0], [2, 0], [0, 1], [1, 1]], n: 3 },
    Z: { c: '#e53935', m: [[0, 0], [1, 0], [1, 1], [2, 1]], n: 3 },
    J: { c: '#14b8a6', m: [[0, 0], [0, 1], [1, 1], [2, 1]], n: 3 },
    L: { c: '#f58a1f', m: [[2, 0], [0, 1], [1, 1], [2, 1]], n: 3 },
  };
  const rotate = (cells, n, dir) => cells.map(([x, y]) => dir > 0 ? [n - 1 - y, x] : [y, n - 1 - x]);

  // ---------- Zustand ----------
  let COLS = 10, ROWS = 20, grid, cur, queue, bag, holdT, holdUsed, score, lines, level, best;
  let state = 'ready', dropT = 0, lockT = 0, t = 0, clearing = null, flash = 0, pops = [];
  function newRound() {
    [COLS, ROWS] = v('size');
    grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    bag = []; queue = []; holdT = null; holdUsed = false; score = 0; lines = 0; level = v('start'); best = getBest();
    clearing = null; pops = [];
    fill(); spawn();
    hud(); state = 'ready'; $('hint').classList.remove('hidden');
  }
  function fill() {
    while (queue.length < 5) {
      if (!bag.length) { bag = Object.keys(SHAPES); for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; } }
      queue.push(bag.pop());
    }
  }
  function spawn(type) {
    type = type || queue.shift(); fill();
    const s = SHAPES[type];
    cur = { type, cells: s.m.map((p) => p.slice()), x: Math.floor((COLS - s.n) / 2), y: type === 'I' ? -1 : 0 };
    lockT = 0; dropT = 0;
    if (!fits(cur.cells, cur.x, cur.y)) gameOver();
  }
  function fits(cells, ox, oy) {
    return cells.every(([x, y]) => {
      const gx = x + ox, gy = y + oy;
      return gx >= 0 && gx < COLS && gy < ROWS && (gy < 0 || !grid[gy][gx]);
    });
  }
  const speed = () => Math.max(0.05, 0.8 * Math.pow(0.82, level - 1));
  const hud = () => { $('score').textContent = score; $('lines').textContent = lines; $('level').textContent = level; };

  // ---------- Ton ----------
  let ac, sound = true;
  try { sound = localStorage.getItem('block.sound') !== '0'; } catch (e) {}
  const updSound = () => { $('sound').style.opacity = sound ? 1 : 0.45; };
  function beep(f, d = 0.06, type = 'triangle', vol = 0.05, up = 1) {
    if (!sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, ac.currentTime); o.frequency.exponentialRampToValueAtTime(f * up, ac.currentTime + d);
      g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }

  // ---------- Aktionen ----------
  function move(dx) { if (fits(cur.cells, cur.x + dx, cur.y)) { cur.x += dx; lockT = 0; beep(300, 0.03); return true; } return false; }
  function turn(dir) {
    if (cur.type === 'O') return;
    const r = rotate(cur.cells, SHAPES[cur.type].n, dir);
    // an Wand oder Boden ein Stück verschieben, wenn es sonst nicht passt
    for (const [kx, ky] of [[0, 0], [-1, 0], [1, 0], [0, -1], [-2, 0], [2, 0], [0, -2]]) {
      if (fits(r, cur.x + kx, cur.y + ky)) { cur.cells = r; cur.x += kx; cur.y += ky; lockT = 0; beep(520, 0.04); return; }
    }
  }
  function soft() { if (fits(cur.cells, cur.x, cur.y + 1)) { cur.y++; score += 1; dropT = 0; hud(); return true; } return false; }
  function hard() {
    let n = 0; while (fits(cur.cells, cur.x, cur.y + 1)) { cur.y++; n++; }
    score += n * 2; lock(); shakeT = 0.12;
  }
  function hold() {
    if (!v('hold') || holdUsed) return;
    const t0 = cur.type; holdUsed = true; beep(400, 0.06);
    if (holdT) spawn(holdT); else spawn();
    holdT = t0;
  }
  let shakeT = 0;
  function lock() {
    for (const [x, y] of cur.cells) {
      const gy = y + cur.y; if (gy < 0) return gameOver();
      grid[gy][x + cur.x] = SHAPES[cur.type].c;
    }
    beep(180, 0.06, 'square', 0.04);
    const full = []; grid.forEach((r, i) => { if (r.every(Boolean)) full.push(i); });
    if (full.length) {
      clearing = { rows: full, t: 0 };
      score += [0, 100, 300, 500, 800][full.length] * level;
      lines += full.length;
      if (v('ramp')) level = Math.max(level, v('start') + Math.floor(lines / 10));
      beep(600 + full.length * 120, 0.18, 'triangle', 0.06, 1.6);
      for (const r of full) for (let x = 0; x < COLS; x++) pops.push({ x: x + 0.5, y: r + 0.5, vx: (Math.random() - 0.5) * 8, vy: -Math.random() * 6, c: grid[r][x], life: 0.6 });
      if (full.length === 4) flash = 1;
      hud(); cur = null;
    } else { holdUsed = false; spawn(); hud(); }
  }
  function finishClear() {
    const rows = clearing.rows;
    grid = grid.filter((_, i) => !rows.includes(i));
    while (grid.length < ROWS) grid.unshift(Array(COLS).fill(null));
    clearing = null; holdUsed = false; spawn();
  }
  function gameOver() {
    state = 'over'; beep(150, 0.5, 'sawtooth', 0.06, 0.5);
    if (score > best) { best = score; try { localStorage.setItem(bestKey(), best); } catch (e) {} }
    setTimeout(() => { if (state === 'over' && !menuOpen()) openMenu(); }, 700);
  }

  // ---------- Steuerung ----------
  const menuOpen = () => !$('menu').classList.contains('hidden');
  function openMenu() {
    if (state === 'play') state = 'pause';
    $('result').innerHTML = state === 'over' ? `Punkte: <b>${score}</b> · Rekord: <b>${best}</b>` : (state === 'pause' ? 'Pause' : `Rekord: <b>${getBest()}</b>`);
    $('start').textContent = state === 'pause' ? 'Weiter' : (state === 'over' ? 'Nochmal' : 'Spielen');
    $('menu').classList.remove('hidden');
  }
  function closeMenu() {
    $('menu').classList.add('hidden');
    if (state === 'over') newRound();
    if (state === 'pause') state = 'play';
  }
  function act(k) {
    if (menuOpen() || state === 'over') return;
    if (state === 'ready') { state = 'play'; $('hint').classList.add('hidden'); }
    if (state === 'pause') state = 'play';
    if (!cur || clearing) return;
    if (k === 'left') move(-1); else if (k === 'right') move(1);
    else if (k === 'rot') turn(1); else if (k === 'rotl') turn(-1);
    else if (k === 'down') soft(); else if (k === 'drop') hard(); else if (k === 'hold') hold();
  }
  // gedrückt halten: nach kurzer Pause wiederholt bewegen
  const rep = {};
  function press(k) {
    act(k);
    if (k === 'left' || k === 'right' || k === 'down') {
      clearTimeout(rep[k]); clearInterval(rep[k + 'i']);
      rep[k] = setTimeout(() => { rep[k + 'i'] = setInterval(() => act(k), k === 'down' ? 40 : 50); }, k === 'down' ? 60 : 160);
    }
  }
  function release(k) { clearTimeout(rep[k]); clearInterval(rep[k + 'i']); }
  const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'rot', KeyW: 'rot', KeyX: 'rot', KeyZ: 'rotl', KeyY: 'rotl',
    ArrowDown: 'down', KeyS: 'down', Space: 'drop', KeyC: 'hold', ShiftLeft: 'hold', ShiftRight: 'hold' };
  const KEYNAME = { arrowleft: 'ArrowLeft', a: 'KeyA', arrowright: 'ArrowRight', d: 'KeyD', arrowup: 'ArrowUp', w: 'KeyW', x: 'KeyX', z: 'KeyZ', y: 'KeyY', arrowdown: 'ArrowDown', s: 'KeyS', ' ': 'Space', c: 'KeyC', shift: 'ShiftLeft', escape: 'Escape', p: 'KeyP', m: 'KeyM', enter: 'Enter' };
  const code = (e) => e.code || KEYNAME[(e.key || '').toLowerCase()] || '';
  addEventListener('keydown', (e) => {
    const c = code(e);
    if (c === 'Escape' || c === 'KeyP') { e.preventDefault(); menuOpen() ? closeMenu() : openMenu(); return; }
    if (c === 'KeyM') { $('sound').click(); return; }
    if (menuOpen()) { if (c === 'Enter' || c === 'Space') { e.preventDefault(); closeMenu(); } return; }
    const k = KEYMAP[c]; if (!k) return;
    e.preventDefault(); if (e.repeat) return;
    press(k);
  }, true);
  addEventListener('keyup', (e) => { const k = KEYMAP[code(e)]; if (k) release(k); }, true);
  addEventListener('blur', () => { for (const k of ['left', 'right', 'down']) release(k); if (state === 'play') openMenu(); });

  // Touch: Knöpfe unter dem Feld
  if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
  document.querySelectorAll('#pad button').forEach((b) => {
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); document.body.classList.add('touch'); press(b.dataset.k); });
    for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, () => release(b.dataset.k));
  });
  $('board').addEventListener('pointerdown', (e) => { e.preventDefault(); act('rot'); });
  $('hint').addEventListener('pointerdown', () => act('rot'));
  $('start').onclick = closeMenu;
  $('open-menu').onclick = openMenu;
  $('reset').onclick = () => { for (const k in OPTS) set[k] = OPTS[k].def; save(); buildMenu(); applyWorld(); newRound(); resize(); };
  $('sound').onclick = () => { sound = !sound; try { localStorage.setItem('block.sound', sound ? '1' : '0'); } catch (e) {} updSound(); };

  // ---------- Ablauf ----------
  function update(dt) {
    t += dt; flash = Math.max(0, flash - dt * 2); shakeT = Math.max(0, shakeT - dt);
    for (const p of pops) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 25 * dt; p.life -= dt; }
    pops = pops.filter((p) => p.life > 0);
    if (state !== 'play') return;
    if (clearing) { clearing.t += dt; if (clearing.t > 0.28) finishClear(); return; }
    if (!cur) return;
    const grounded = !fits(cur.cells, cur.x, cur.y + 1);
    if (grounded) { lockT += dt; if (lockT > 0.5) lock(); }
    else { dropT += dt; if (dropT >= speed()) { dropT = 0; cur.y++; } }
  }

  // ---------- Zeichnen ----------
  let cell = 28, dpr = 1, side = 4.6;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    side = v('preview') || v('hold') ? 4.6 : 0;
    const padH = document.body.classList.contains('touch') ? 66 : 0;
    const maxW = innerWidth - 24, maxH = innerHeight - 54 - 36 - padH;
    cell = Math.max(12, Math.floor(Math.min(maxW / (COLS + side), maxH / ROWS)));
    cv.width = (COLS + side) * cell * dpr; cv.height = ROWS * cell * dpr;
    cv.style.width = (COLS + side) * cell + 'px'; cv.style.height = ROWS * cell + 'px';
  }
  function applyWorld() {
    const w = WORLDS[v('world')];
    $('hud').style.background = w.hud; $('frame').style.background = w.frame;
    document.body.style.background = `radial-gradient(120% 90% at 50% 0%, ${w.page[0]} 0%, ${w.page[1]} 55%, ${w.page[2]} 100%) fixed ${w.page[1]}`;
    document.querySelector('meta[name=theme-color]').content = w.hud;
  }
  function shade(hex, k) { const n = parseInt(hex.slice(1), 16), f = (c) => Math.round(k > 1 ? c + (255 - c) * (k - 1) : c * k); return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`; }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
  // Ein Block im Stil der Snake-Steine: Schatten unten, helle Kante oben
  function block(x, y, col, s = cell, alpha = 1) {
    ctx.globalAlpha = alpha;
    const g = s * 0.06, r = s * 0.22;
    ctx.fillStyle = shade(col, 0.7); rr(x + g, y + g + s * 0.06, s - 2 * g, s - 2 * g, r); ctx.fill();
    ctx.fillStyle = col; rr(x + g, y + g, s - 2 * g, s - 2 * g - s * 0.06, r); ctx.fill();
    ctx.fillStyle = shade(col, 1.35); rr(x + s * 0.2, y + s * 0.16, s * 0.4, s * 0.14, s * 0.07); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function mini(type, cx, cy, s) {
    const sh = SHAPES[type], xs = sh.m.map((p) => p[0]), ys = sh.m.map((p) => p[1]);
    const w = Math.max(...xs) - Math.min(...xs) + 1, h = Math.max(...ys) - Math.min(...ys) + 1;
    for (const [x, y] of sh.m) block(cx + (x - Math.min(...xs) - w / 2) * s, cy + (y - Math.min(...ys) - h / 2) * s, sh.c, s);
  }
  function draw() {
    const w = WORLDS[v('world')], c = cell;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (shakeT) ctx.translate(0, shakeT * 20);
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { ctx.fillStyle = w.grass[(x + y) & 1]; ctx.fillRect(x * c, y * c, c + 1, c + 1); }
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const col = grid[y][x]; if (!col) continue;
      if (clearing && clearing.rows.includes(y)) {
        const k = clearing.t / 0.28;
        ctx.fillStyle = `rgba(255,255,255,${1 - k})`; rr(x * c + c * k / 2, y * c + c * k / 2, c * (1 - k), c * (1 - k), c * 0.2); ctx.fill();
      } else block(x * c, y * c, col);
    }
    if (cur && state !== 'over') {
      const col = SHAPES[cur.type].c;
      if (v('ghost')) {
        let gy = cur.y; while (fits(cur.cells, cur.x, gy + 1)) gy++;
        for (const [x, y] of cur.cells) if (y + gy >= 0) { ctx.fillStyle = 'rgba(0,0,0,.13)'; rr((x + cur.x) * c + c * 0.08, (y + gy) * c + c * 0.08, c * 0.84, c * 0.84, c * 0.2); ctx.fill(); }
      }
      for (const [x, y] of cur.cells) if (y + cur.y >= 0) block((x + cur.x) * c, (y + cur.y) * c, col);
    }
    for (const p of pops) { ctx.globalAlpha = Math.max(0, p.life / 0.6); ctx.fillStyle = p.c; rr(p.x * c - c * 0.15, p.y * c - c * 0.15, c * 0.3, c * 0.3, c * 0.08); ctx.fill(); }
    ctx.globalAlpha = 1;
    if (flash) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.5})`; ctx.fillRect(0, 0, COLS * c, ROWS * c); }
    // Seitenleiste: Halten und Vorschau
    if (side) {
      const x0 = COLS * c, sw = side * c;
      ctx.fillStyle = w.frame; ctx.fillRect(x0, 0, sw, ROWS * c);
      ctx.fillStyle = w.panel; ctx.fillRect(x0 + c * 0.3, 0, sw - c * 0.3, ROWS * c);
      ctx.fillStyle = v('world') === 'night' ? '#fff' : '#2c4a18';
      ctx.font = `600 ${Math.round(c * 0.55)}px Fredoka, sans-serif`; ctx.textAlign = 'center';
      let y = c * 0.9;
      const mx = x0 + c * 0.15 + sw / 2;
      if (v('preview')) {
        ctx.fillText('Nächster', mx, y);
        for (let i = 0; i < v('preview'); i++) { mini(queue[i], mx, y + c * 1.5 + i * c * 2.6, i ? c * 0.6 : c * 0.8); }
        y += c * 1.4 + v('preview') * c * 2.6;
      }
      if (v('hold')) {
        ctx.fillText('Halten', mx, y + c * 0.4);
        if (holdT) { ctx.globalAlpha = holdUsed ? 0.4 : 1; mini(holdT, mx, y + c * 1.9, c * 0.7); ctx.globalAlpha = 1; }
      }
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    update(dt); draw(); requestAnimationFrame(frame);
  }
  addEventListener('resize', resize);
  buildMenu(); applyWorld(); newRound(); updSound(); resize(); openMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
